<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭЛОУ-АВТ-4 — 3D-модель: аппараты, насосы, трубопроводы</title>
<style>
  :root{
    --bg:#0b1118;--panel:#111a24;--panel-2:#16212e;--border:#223042;
    --text:#e6edf3;--muted:#7f93a6;--accent:#38bdf8;
    --lbl-bg:rgba(9,13,18,.78);--hover:rgba(255,255,255,.06);
    --row-off:#4e5c6a;--leg:#a8b6c2;--hint-b:#9db0c2;--td-line:rgba(255,255,255,.05);
    --btn-bg:#1b2531;--btn-hover:#243043;
  }
  html[data-theme='light']{
    --bg:#f3f6fb;--panel:#ffffff;--panel-2:#edf2f9;--border:#d7e0ec;
    --text:#1e293b;--muted:#64748b;--accent:#0284c7;
    --lbl-bg:rgba(255,255,255,.88);--hover:rgba(15,23,42,.05);
    --row-off:#9aa7b6;--leg:#5b7282;--hint-b:#33475a;--td-line:rgba(15,23,42,.07);
    --btn-bg:#edf2f9;--btn-hover:#e2e8f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
  #cv{position:fixed;inset:0;display:block}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-50%);
    font:600 11px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.04em;
    padding:2px 6px;border:1px solid currentColor;border-radius:4px;
    background:var(--lbl-bg);white-space:nowrap}
  .lbl.p{font-size:9.5px;padding:1px 4px;opacity:.85}
  .zlbl{position:absolute;transform:translate(-50%,-50%);
    font:700 12px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.22em;
    text-transform:uppercase;white-space:nowrap;text-align:center;opacity:.9}
  .zlbl small{display:block;font-size:10px;letter-spacing:.1em;opacity:.75;text-transform:none;font-weight:400}
  #panel{position:fixed;top:14px;left:14px;width:250px;z-index:6;max-height:calc(100vh - 28px);
    overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #panel h2{margin:0;padding:8px 10px;border-bottom:1px solid var(--border);border-top:1px solid var(--border);
    font:600 10px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  #panel h2:first-child{border-top:none}
  .row{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;
    font:500 11.5px/1.25 ui-monospace,monospace}
  .row:hover{background:var(--hover)}
  .row .no{color:var(--muted);font-size:10px}
  .sw{width:9px;height:9px;border-radius:1px;flex:0 0 auto}
  .pl{width:16px;height:3px;border-radius:2px;flex:0 0 auto}
  .row input{accent-color:var(--accent);margin:0}
  .row.off{color:var(--row-off)}
  .leg{display:flex;align-items:center;gap:8px;padding:3px 10px;font:400 10.5px ui-monospace,monospace;color:var(--leg)}
  #info{position:fixed;right:14px;top:14px;width:276px;z-index:6;max-height:calc(100vh - 28px);overflow:auto;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #info h2{margin:0;padding:9px 12px;border-bottom:1px solid var(--border);
    font:700 14px/1 ui-monospace,monospace;letter-spacing:.08em}
  #info .nm{padding:8px 12px 2px;font-size:12px;line-height:1.4}
  #info .zn{padding:0 12px 8px;font:400 10.5px ui-monospace,monospace;color:var(--muted)}
  #info table{width:100%;border-collapse:collapse;font:400 11.5px/1 ui-monospace,monospace}
  #info td{padding:5px 12px;border-top:1px solid var(--td-line)}
  #info td:first-child{color:var(--muted)}
  #info td:last-child{text-align:right}
  #hint{position:fixed;left:14px;bottom:10px;z-index:6;font:400 11px/1.6 ui-monospace,monospace;color:var(--muted);
    background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;pointer-events:none}
  #hint b{color:var(--hint-b);font-weight:600}
  button.rst{margin:8px 10px 10px;padding:7px 10px;width:calc(100% - 20px);
    background:var(--btn-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;
    font:500 12px 'Segoe UI',Roboto,Arial,sans-serif;cursor:pointer;transition:filter .15s}
  button.rst:hover{background:var(--btn-hover)}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;
    font:400 13px/1.7 ui-monospace,monospace;color:var(--muted);padding:40px}
  @media (max-width:760px){#panel{width:196px}#info{width:200px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>

<div id="panel">
  <h2>Участки установки</h2><div id="zones"></div>
  <h2>Слои</h2><div id="layers"></div>
  <h2>Трубопроводы</h2><div id="legend"></div>
  <button class="rst" id="reset">Вернуть обзор</button>
</div>

<div id="info">
  <h2 id="i-tag"></h2>
  <div class="nm" id="i-name"></div>
  <div class="zn" id="i-zone"></div>
  <table id="i-tbl"></table>
</div>

<div id="hint"><b>ЛКМ</b> — поворот &nbsp; <b>колесо</b> — приближение &nbsp; <b>ПКМ / Shift</b> — сдвиг<br>
  <b>клик по аппарату</b> — характеристика</div>
<div id="err">Не удалось загрузить библиотеку Three.js.<br>Откройте файл при наличии доступа к сети.</div>

<script src="/three/three.min.js"></script>
<script>
if (!window.THREE) { document.getElementById('err').style.display='grid'; }
else (function(){
'use strict';

/* ============================================================
   УЧАСТКИ
   ============================================================ */
const ZONES = {
  z1:{n:'01',t:'Блок ЭЛОУ',            d:'обессоливание и обезвоживание', c:0x3fb8ab, x1:-142,x2:-92, z1:-70,z2:22},
  z2:{n:'02',t:'Теплообмен нефти',     d:'рекуперация тепла',             c:0x4d8fd6, x1:-88, x2:-58, z1:-26,z2:26},
  z3:{n:'03',t:'Отбензинивание К-1',   d:'колонна К-1, ёмкость Е-1',      c:0xe0a24b, x1:-56, x2:-30, z1:-16,z2:30},
  z4:{n:'04',t:'Печи П-1…П-3',         d:'нагрев до 365 °С',              c:0xe0552f, x1:-34, x2:44,  z1:-46,z2:-12},
  z5:{n:'05',t:'Атмосферный блок',     d:'К-2 и стриппинги К-3/1,2,3',    c:0xcf6f9e, x1:-12, x2:34,  z1:-6, z2:52},
  z6:{n:'06',t:'Стабилизация',         d:'К-4, К-7, Е-3',                 c:0x9b86ee, x1:36,  x2:68,  z1:-4, z2:58},
  z7:{n:'07',t:'Вторичная перегонка',  d:'К-9, К-10, К-12, печь П-4',     c:0x6cc35a, x1:72,  x2:138, z1:-36,z2:34},
  z8:{n:'08',t:'Конденсация и охлаждение', d:'АВЗ и водяные холодильники',c:0x5fbfd6, x1:-58, x2:20,  z1:42, z2:72},
  z9:{n:'09',t:'Операторная',          d:'помещение управления',          c:0x8a97a4, x1:-60, x2:-12, z1:90, z2:116},
  z10:{n:'10',t:'Сырьевой парк тит. 55/5', d:'Р-10…Р-15, промежуточное хранение', c:0xd98c4a, x1:-330,x2:-146, z1:-95,z2:86}
};

/* ============================================================
   РАЗРЫВЫ МЕЖДУ УЧАСТКАМИ
   Монотонная развёртка координат: габариты аппаратов сохраняются,
   раздвигаются только межблочные расстояния (противопожарные разрывы).
   ============================================================ */
const XGAP=[[-145,54],[-90,20],[-57,16],[-29,16],[35,18],[70,18]];
const ZGAP=[[-8,18],[38,20],[80,22]];
function MX(x){ let d=0; for(const [b,g] of XGAP) if(x>b) d+=g; return x+d; }
function MZ(z){ let d=0; for(const [b,g] of ZGAP) if(z>b) d+=g; return z+d; }

/* ============================================================
   ТИПЫ ТРУБОПРОВОДОВ
   ============================================================ */
const PIPE = {
  crude : {c:0x7a5230, t:'Сырая нефть'},
  desalt: {c:0xb07b33, t:'Обессоленная нефть'},
  strip : {c:0xd59a3f, t:'Отбензиненная нефть'},
  benz  : {c:0xe6c84a, t:'Бензин, пары НК-180 °С'},
  dist  : {c:0x57a860, t:'Светлые дистилляты'},
  mazut : {c:0x515e6b, t:'Мазут'},
  gas   : {c:0xa878e0, t:'Газ, ПБФ'},
  steam : {c:0xcfd8e0, t:'Водяной пар'},
  water : {c:0x4d8fd6, t:'Вода, стоки'},
  cable : {c:0x8c96a0, t:'Кабельные трассы КИПиА'}
};

/* ============================================================
   СЦЕНА
   ============================================================ */
const THEME = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
document.documentElement.setAttribute('data-theme', THEME);
function palOf(t){ return t === 'light'
  ? { bg:0xf3f6fb, fog:0xf3f6fb, ground:0xffffff, grid:0xd7e0ec, grid2:0xc3d0da, hemi:0xffffff, hemiG:0xdfe7f0, sun:0xfff7ea }
  : { bg:0x0b1118, fog:0x0b1118, ground:0x1b232c, grid:0x2b3a4a, grid2:0x1f2a34, hemi:0x9fb6cc, hemiG:0x141a20, sun:0xfff0dc }; }
const PAL = palOf(THEME);

const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.bg);
scene.fog = new THREE.Fog(PAL.fog, 520, 1400);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, 2400);
scene.add(new THREE.HemisphereLight(PAL.hemi, PAL.hemiG, 0.75));
const sun = new THREE.DirectionalLight(PAL.sun, 0.85); sun.position.set(-90,160,110); scene.add(sun);
const fill = new THREE.DirectionalLight(0x6f90b8, 0.35); fill.position.set(120,60,-120); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1800,1200), new THREE.MeshLambertMaterial({color:PAL.ground}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; scene.add(ground);
const grid = new THREE.GridHelper(1800,180,PAL.grid,PAL.grid2); grid.position.y = 0.01; scene.add(grid);

/* материалы */
const steel  = new THREE.MeshLambertMaterial({color:0xb9c2cb});
const steel2 = new THREE.MeshLambertMaterial({color:0x99a5b0});
const dark   = new THREE.MeshLambertMaterial({color:0x4e5a66});
const brick  = new THREE.MeshLambertMaterial({color:0x8d8378});
const conc   = new THREE.MeshLambertMaterial({color:0x6a7078});
const ceramic= new THREE.MeshLambertMaterial({color:0xd8cfc0});
const acc = c => new THREE.MeshLambertMaterial({color:c});
const pipeMats = {}; Object.entries(PIPE).forEach(([k,v]) => pipeMats[k] = new THREE.MeshLambertMaterial({color:v.c}));

/* реестр */
const picks = [], tagged = [], reg = [];
/* габариты аппаратов в плане — исходные данные для трассировки трубопроводов */
const OBST = [];
function obst(x, z, ex, ez, rot, m){
  if (rot && Math.abs(Math.sin(rot)) > 0.5){ const t = ex; ex = ez; ez = t; }
  OBST.push({x, z, ex, ez, m: m||2.2});
}
function add(g, o){                       // o: {zone, layer, tag?, name?, spec?, top?}
  g.userData = o; scene.add(g);
  reg.push({g, zone:o.zone, layer:o.layer});
  if (o.selectable !== false) g.traverse(m => { if (m.isMesh) picks.push(m); });
  if (o.tag) tagged.push({obj:g, top:o.top||10, zone:o.zone, layer:o.layer,
                          tag:o.tag, color:ZONES[o.zone].c, small:o.layer==='pump'});
  return g;
}

/* зоны на площадке */
const zoneLabels = [];
Object.entries(ZONES).forEach(([k,z])=>{
  const g = new THREE.Group();
  const X1=MX(z.x1),X2=MX(z.x2),Z1=MZ(z.z1),Z2=MZ(z.z2);
  const w=X2-X1, l=Z2-Z1, cx=(X1+X2)/2, cz=(Z1+Z2)/2;
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(w,l), new THREE.MeshBasicMaterial({color:z.c,transparent:true,opacity:0.055}));
  pad.rotation.x=-Math.PI/2; pad.position.set(cx,0.03,cz); g.add(pad);
  const ed = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w,l)),
    new THREE.LineBasicMaterial({color:z.c,transparent:true,opacity:0.45}));
  ed.rotation.x=-Math.PI/2; ed.position.set(cx,0.05,cz); g.add(ed);
  add(g,{zone:k, layer:'zone', selectable:false});
  z.cx=cx; z.cz=cz; z.mz2=Z2;
});

/* ============================================================
   ГЕОМЕТРИЯ
   ============================================================ */
function column(o){
  const g=new THREE.Group(), c=ZONES[o.zone].c, r=o.d/2;
  const sk=o.skirt===undefined?3.2:o.skirt, hCyl=o.h-o.d*0.5;
  const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r,hCyl,28,1,true),steel); b.position.y=sk+hCyl/2; g.add(b);
  [[1,sk+hCyl],[-1,sk]].forEach(([s,y])=>{
    const hd=new THREE.Mesh(new THREE.SphereGeometry(r,28,10,0,Math.PI*2,0,Math.PI/2),steel);
    hd.scale.y=0.55*s; hd.position.y=y; g.add(hd);});
  const sc=new THREE.Mesh(new THREE.CylinderGeometry(r*0.96,r*1.02,sk,24),conc); sc.position.y=sk/2; g.add(sc);
  const n=Math.max(2,Math.round(hCyl/9));
  for(let i=1;i<=n;i++){ const y=sk+hCyl*i/(n+0.4);
    const rl=new THREE.Mesh(new THREE.TorusGeometry(r+0.85,0.12,6,26),dark); rl.rotation.x=Math.PI/2; rl.position.y=y+0.5; g.add(rl);
    const fl=new THREE.Mesh(new THREE.CylinderGeometry(r+0.9,r+0.9,0.12,26,1,true),steel2); fl.position.y=y; g.add(fl);}
  const bd=new THREE.Mesh(new THREE.CylinderGeometry(r*1.012,r*1.012,1.1,28,1,true),acc(c)); bd.position.y=sk+1.4; g.add(bd);
  const ld=new THREE.Mesh(new THREE.BoxGeometry(0.75,hCyl,0.06),dark); ld.position.set(0,sk+hCyl/2,r+1.0); g.add(ld);
  g.position.set(MX(o.x),0,MZ(o.z)); o.top=o.h+sk; o.layer='equip'; obst(MX(o.x),MZ(o.z),r+2.6,r+2.6,0,2.6);
  return add(g,o);
}

function horiz(o){
  const g=new THREE.Group(), c=ZONES[o.zone].c, r=o.d/2, L=o.L, el=o.elev===undefined?2.2:o.elev, mat=o.mat||steel;
  const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,22),mat); b.rotation.z=Math.PI/2; b.position.y=el; g.add(b);
  [-1,1].forEach(s=>{ const hd=new THREE.Mesh(new THREE.SphereGeometry(r,20,8,0,Math.PI*2,0,Math.PI/2),mat);
    hd.rotation.z=s*Math.PI/2; hd.scale.y=0.6; hd.position.set(s*L/2,el,0); g.add(hd);});
  [-1,1].forEach(s=>{ const sd=new THREE.Mesh(new THREE.BoxGeometry(1.2,el,r*1.7),conc); sd.position.set(s*L*0.32,el/2,0); g.add(sd);});
  const bd=new THREE.Mesh(new THREE.CylinderGeometry(r*1.012,r*1.012,0.9,22,1,true),acc(c));
  bd.rotation.z=Math.PI/2; bd.position.set(-L*0.42,el,0); g.add(bd);
  g.position.set(MX(o.x),0,MZ(o.z)); if(o.rot) g.rotation.y=o.rot; o.top=el+r; o.layer='equip'; obst(MX(o.x),MZ(o.z),L/2+2.2,r+2.2,o.rot,2.2);
  return add(g,o);
}

function dehydrator(o){
  const g=new THREE.Group(), c=ZONES[o.zone].c, r=o.d/2, L=o.L, el=3.0;
  const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,26),steel); b.rotation.z=Math.PI/2; b.position.y=el; g.add(b);
  [-1,1].forEach(s=>{
    const hd=new THREE.Mesh(new THREE.SphereGeometry(r,24,10,0,Math.PI*2,0,Math.PI/2),steel);
    hd.rotation.z=s*Math.PI/2; hd.scale.y=0.62; hd.position.set(s*L/2,el,0); g.add(hd);
    const nz=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,1.6,12),steel2);
    nz.rotation.z=Math.PI/2; nz.position.set(s*(L/2+1.1),el,0); g.add(nz);
    const fl=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.16,14),dark);
    fl.rotation.z=Math.PI/2; fl.position.set(s*(L/2+1.85),el,0); g.add(fl);});
  [-1,1].forEach(s=>{
    const pier=new THREE.Mesh(new THREE.BoxGeometry(1.6,el-0.4,r*1.9),conc); pier.position.set(s*L*0.3,(el-0.4)/2,0); g.add(pier);
    const sad=new THREE.Mesh(new THREE.CylinderGeometry(r*1.04,r*1.04,1.7,20,1,true,Math.PI*0.15,Math.PI*0.7),dark);
    sad.rotation.z=Math.PI/2; sad.rotation.y=Math.PI; sad.position.set(s*L*0.3,el,0); g.add(sad);
    const fnd=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.5,r*2.4),conc); fnd.position.set(s*L*0.3,0.25,0); g.add(fnd);});
  for(let i=-1;i<=1;i++){
    const tx=i*L*0.28;
    const tr=new THREE.Mesh(new THREE.BoxGeometry(2.0,1.5,1.5),acc(c)); tr.position.set(tx,el+r+1.35,0); g.add(tr);
    const rd=new THREE.Mesh(new THREE.BoxGeometry(2.1,1.0,0.18),dark); rd.position.set(tx,el+r+1.35,0.85); g.add(rd);
    const rd2=rd.clone(); rd2.position.z=-0.85; g.add(rd2);
    for(const s of [-0.55,0.55]){
      const po=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,1.3,10),ceramic); po.position.set(tx+s,el+r+2.7,0); g.add(po);
      for(let k=0;k<4;k++){ const sk=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.07,12),ceramic);
        sk.position.set(tx+s,el+r+2.2+k*0.34,0); g.add(sk);} }
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.4,8),dark); rod.position.set(tx,el+r+0.35,0); g.add(rod);}
  const deck=new THREE.Mesh(new THREE.BoxGeometry(L*0.86,0.1,1.5),steel2); deck.position.set(0,el+r+0.55,-r*0.95); g.add(deck);
  [-1,1].forEach(s=>{ const rl=new THREE.Mesh(new THREE.BoxGeometry(L*0.86,0.06,0.06),dark);
    rl.position.set(0,el+r+1.6,-r*0.95+s*0.72); g.add(rl);});
  const st=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.08,el+r+1.2),dark);
  st.position.set(-L*0.42,(el+r)/2+0.3,-r*1.9); st.rotation.x=-Math.PI/5; g.add(st);
  const man=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.35,16),dark);
  man.position.set(L*0.12,el+r*0.35,r*0.9); man.rotation.x=Math.PI/2.6; g.add(man);
  const dr=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,1.2,10),steel2); dr.position.set(0,el-r-0.5,0); g.add(dr);
  g.position.set(MX(o.x),0,MZ(o.z)); if(o.rot) g.rotation.y=o.rot; o.top=el+r+3.6; o.layer='equip'; obst(MX(o.x),MZ(o.z),L/2+3.0,r+3.0,o.rot,3.0);
  return add(g,o);
}

/* кожухотрубчатый аппарат: теплообменник (cool=false) или водяной холодильник (cool=true) */
function exchanger(o){
  const g=new THREE.Group(), c=o.cool?PIPE.water.c:ZONES[o.zone].c, r=o.d/2, L=o.L, el=o.elev;
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L*0.72,20),steel); sh.rotation.z=Math.PI/2; sh.position.y=el; g.add(sh);
  [-L*0.36,L*0.36].forEach(x=>{ const f=new THREE.Mesh(new THREE.CylinderGeometry(r*1.22,r*1.22,0.3,22),dark);
    f.rotation.z=Math.PI/2; f.position.set(x,el,0); g.add(f);});

/* ============================================================
   ТРУБОПРОВОДЫ
   ============================================================ */
const UP = new THREE.Vector3(0,1,0), tmpA=new THREE.Vector3(), tmpB=new THREE.Vector3();
function segment(g, a, b, r, mat){
  tmpA.set(a[0],a[1],a[2]); tmpB.set(b[0],b[1],b[2]);
  const dir = tmpB.clone().sub(tmpA); const len = dir.length(); if (len < 0.05) return;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10), mat);
  m.position.copy(tmpA).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize()); g.add(m);
}
/* отрисовка трассы: трубы, отводы, стойки и опорные балки под горизонтальными участками */
function runPipe(pts, r, type, zone){
  const g=new THREE.Group(), mat=pipeMats[type];
  for(let i=0;i<pts.length-1;i++) segment(g, pts[i], pts[i+1], r, mat);
  for(let i=1;i<pts.length-1;i++){
    const e=new THREE.Mesh(new THREE.SphereGeometry(r*1.12,10,8),mat);
    e.position.set(pts[i][0],pts[i][1],pts[i][2]); g.add(e);}
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    if (Math.abs(a[1]-b[1])>0.4 || a[1]>13) continue;
    const len=Math.hypot(b[0]-a[0], b[2]-a[2]); const n=Math.floor(len/11);
    for(let k=1;k<=n;k++){
      const t=k/(n+1), x=a[0]+(b[0]-a[0])*t, z=a[2]+(b[2]-a[2])*t;
      const p=new THREE.Mesh(new THREE.BoxGeometry(0.3,a[1]-r,0.3),conc);
      p.position.set(x,(a[1]-r)/2,z); g.add(p);
      const sh=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.22,0.45),conc);
      sh.position.set(x,a[1]-r-0.12,z); if(Math.abs(b[0]-a[0])<0.5) sh.rotation.y=Math.PI/2; g.add(sh);}
  }
  return add(g,{zone, layer:'pipe', selectable:false});
}

/* ---------- сетка проходимости площадки ---------- */
const CELL=3, GX0=-350, GZ0=-125, GX1=300, GZ1=230;
const GNX=Math.ceil((GX1-GX0)/CELL), GNZ=Math.ceil((GZ1-GZ0)/CELL);
let blocked=null;
function buildGrid(){
  blocked=new Uint8Array(GNX*GNZ);
  for(const o of OBST){
    const i0=Math.max(0,Math.floor((o.x-o.ex-GX0)/CELL)), i1=Math.min(GNX-1,Math.ceil((o.x+o.ex-GX0)/CELL));
    const j0=Math.max(0,Math.floor((o.z-o.ez-GZ0)/CELL)), j1=Math.min(GNZ-1,Math.ceil((o.z+o.ez-GZ0)/CELL));
    for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++) blocked[j*GNX+i]=1;
  }
}
let comp=null, mainComp=-1;
function buildComponents(){
  comp=new Int32Array(GNX*GNZ).fill(-1);
  let id=0, best=-1, bestN=0;
  for(let j=0;j<GNZ;j++) for(let i=0;i<GNX;i++){
    const c=j*GNX+i;
    if(blocked[c]||comp[c]>=0) continue;
    const st=[c]; comp[c]=id; let n=0;
    while(st.length){ const q=st.pop(); n++;
      const qi=q%GNX, qj=(q-qi)/GNX;
      for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ii=qi+di, jj=qj+dj;
        if(ii<0||jj<0||ii>=GNX||jj>=GNZ) continue;
        const nc=jj*GNX+ii;
        if(blocked[nc]||comp[nc]>=0) continue;
        comp[nc]=id; st.push(nc);}
    }
    if(n>bestN){bestN=n; best=id;}
    id++;
  }
  mainComp=best;
}
const ci=x=>Math.max(0,Math.min(GNX-1,Math.round((x-GX0)/CELL)));
const cj=z=>Math.max(0,Math.min(GNZ-1,Math.round((z-GZ0)/CELL)));
const wx=i=>GX0+i*CELL, wz=j=>GZ0+j*CELL;
const freeC=(i,j)=>i>=0&&j>=0&&i<GNX&&j<GNZ&&!blocked[j*GNX+i];

/* выход из-под аппарата ортогональным патрубком до ближайшего свободного коридора */
const okC=(i,j)=>freeC(i,j)&&comp[j*GNX+i]===mainComp;
/* выход из-под аппарата: кратчайший прямой патрубок до сквозного коридора */
function findExit(x,z){
  const i=ci(x), j=cj(z);
  if (okC(i,j)) return [wx(i),wz(j)];
  let best=null, bd=1e9;
  for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
    for(let k=1;k<=26;k++){
      const ii=i+di*k, jj=j+dj*k;
      if(ii<0||jj<0||ii>=GNX||jj>=GNZ) break;
      if(okC(ii,jj)){ if(k<bd){ bd=k; best=[wx(ii),wz(jj)]; } break; }
    }
  }
  if(best) return best;
  for(let R=1;R<=30;R++)
    for(let di=-R;di<=R;di++) for(let dj=-R;dj<=R;dj++){
      if(Math.max(Math.abs(di),Math.abs(dj))!==R) continue;
      if(okC(i+di,j+dj)) return [wx(i+di),wz(j+dj)];
    }
  return [wx(i),wz(j)];
}

/* А* по четырём направлениям со штрафом за поворот — ортогональная трасса вокруг аппаратов */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function routeGrid(a,b){
  const si=ci(a[0]), sj=cj(a[1]), gi=ci(b[0]), gj=cj(b[1]);
  if(si===gi&&sj===gj) return [[wx(si),wz(sj)]];
  const S=GNX*GNZ*5;
  const g=new Float32Array(S).fill(Infinity), prev=new Int32Array(S).fill(-1);
  const heap=[];
  const push=(f,s)=>{heap.push([f,s]); let c=heap.length-1;
    while(c>0){const p=(c-1)>>1; if(heap[p][0]<=heap[c][0])break; const t=heap[p];heap[p]=heap[c];heap[c]=t; c=p;}};
  const pop=()=>{const top=heap[0], last=heap.pop();
    if(heap.length){heap[0]=last; let c=0;
      for(;;){let m=c; const l=2*c+1,rr=2*c+2;
        if(l<heap.length&&heap[l][0]<heap[m][0])m=l;
        if(rr<heap.length&&heap[rr][0]<heap[m][0])m=rr;
        if(m===c)break; const t=heap[m];heap[m]=heap[c];heap[c]=t; c=m;}}
    return top;};
  const H=(i,j)=>Math.abs(i-gi)+Math.abs(j-gj);
  const s0=(sj*GNX+si)*5+4; g[s0]=0; push(H(si,sj),s0);
  let goal=-1, guard=0;
  while(heap.length && guard++<2000000){
    const st=pop()[1]; const cell=Math.floor(st/5), d=st%5;
    const i=cell%GNX, j=(cell-i)/GNX;
    if(i===gi&&j===gj){ goal=st; break; }
    for(let k=0;k<4;k++){
      const ii=i+DIRS[k][0], jj=j+DIRS[k][1];
      if(!freeC(ii,jj)) continue;
      const ns=(jj*GNX+ii)*5+k;
      const ng=g[st]+1+((d!==4&&d!==k)?4:0);
      if(ng<g[ns]){ g[ns]=ng; prev[ns]=st; push(ng+H(ii,jj)*1.02, ns); }
    }
  }
  if(goal<0) return null;
  const out=[]; let st=goal;
  while(st>=0){ const cell=Math.floor(st/5), i=cell%GNX, j=(cell-i)/GNX;
    out.push([wx(i),wz(j)]); st=prev[st]; }
  out.reverse();
  const simp=[out[0]];                       // оставляем только точки перелома
  for(let i=1;i<out.length-1;i++){
    const a=out[i-1], b=out[i], c=out[i+1];
    const d1x=Math.sign(b[0]-a[0]), d1z=Math.sign(b[1]-a[1]);
    const d2x=Math.sign(c[0]-b[0]), d2z=Math.sign(c[1]-b[1]);
    if(d1x!==d2x || d1z!==d2z) simp.push(b);
  }
  simp.push(out[out.length-1]);
  return simp;
}

/* прокладка линии: штуцер → стояк → ярус опор → спуск к аппарату */
let pipeIdx=0;
function link(a,b,_h,r,type,zone){
  if(!blocked){ buildGrid(); buildComponents(); }
  a=[MX(a[0]),a[1],MZ(a[2])]; b=[MX(b[0]),b[1],MZ(b[2])];
  const ea=findExit(a[0],a[2]), eb=findExit(b[0],b[2]);
  const path=routeGrid(ea,eb) || [ea,eb];
  const tier=5.6+(pipeIdx++%8)*0.72;
  const pts=[[a[0],a[1],a[2]]];
  if(Math.abs(ea[0]-a[0])>0.3||Math.abs(ea[1]-a[2])>0.3){
    if(Math.abs(ea[0]-a[0])>=Math.abs(ea[1]-a[2])) pts.push([ea[0],a[1],a[2]]);
    else pts.push([a[0],a[1],ea[1]]);
  }
  pts.push([ea[0],a[1],ea[1]]);
  pts.push([ea[0],tier,ea[1]]);
  for(const p of path) pts.push([p[0],tier,p[1]]);
  pts.push([eb[0],tier,eb[1]]);
  pts.push([eb[0],b[1],eb[1]]);
  if(Math.abs(eb[0]-b[0])>0.3||Math.abs(eb[1]-b[2])>0.3){
    if(Math.abs(eb[0]-b[0])>=Math.abs(eb[1]-b[2])) pts.push([b[0],b[1],eb[1]]);
    else pts.push([eb[0],b[1],b[2]]);
  }
  pts.push([b[0],b[1],b[2]]);
  const cl=[pts[0]];
  for(let i=1;i<pts.length;i++){ const p=cl[cl.length-1], c=pts[i];
    if(Math.abs(p[0]-c[0])>0.15||Math.abs(p[1]-c[1])>0.15||Math.abs(p[2]-c[2])>0.15) cl.push(c);}
  return runPipe(cl, r, type, zone);
}

/* ============================================================
   ПОДПИСИ
   ============================================================ */
const labelLayer = document.getElementById('labels');
tagged.forEach(t=>{
  const el=document.createElement('div'); el.className='lbl'+(t.small?' p':'');
  el.textContent=t.tag; el.style.color='#'+t.color.toString(16).padStart(6,'0');
  labelLayer.appendChild(el); t.el=el;});
const zoneLabelEls=[];
Object.entries(ZONES).forEach(([k,z])=>{
  const el=document.createElement('div'); el.className='zlbl';
  el.innerHTML=`${z.n} · ${z.t}<small>${z.d}</small>`;
  el.style.color='#'+z.c.toString(16).padStart(6,'0');
  labelLayer.appendChild(el); zoneLabelEls.push({z,el,key:k});});

/* ============================================================
   КАМЕРА
   ============================================================ */
const target=new THREE.Vector3(-20,14,26);
let dist=640, yaw=-0.7, pitch=0.36;
const HOME={dist:640,yaw:-0.7,pitch:0.36,t:target.clone()};
function applyCam(){
  pitch=Math.max(0.03,Math.min(1.42,pitch)); dist=Math.max(16,Math.min(1300,dist));
  camera.position.set(target.x+dist*Math.cos(pitch)*Math.sin(yaw), target.y+dist*Math.sin(pitch),
                      target.z+dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(target);}
applyCam();
let drag=null,moved=0;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,btn:e.button,sh:e.shiftKey};moved=0;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{ if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  if(drag.btn===2||drag.sh){ const k=dist*0.0016;
    const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)), f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
    target.addScaledVector(r,-dx*k).addScaledVector(f,-dy*k); target.y=Math.max(0,target.y);
  } else { yaw-=dx*0.005; pitch+=dy*0.004; }
  applyCam();});
addEventListener('pointerup',()=>drag=null);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault(); dist*=Math.pow(1.0016,e.deltaY); applyCam();},{passive:false});
let pinch=null;
cv.addEventListener('touchstart',e=>{ if(e.touches.length===2)
  pinch={d:td(e),x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};});
cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){ e.preventDefault();
  const d=td(e); dist*=pinch.d/d; pinch.d=d;
  const cx=(e.touches[0].clientX+e.touches[1].clientX)/2, cy=(e.touches[0].clientY+e.touches[1].clientY)/2, k=dist*0.0016;
  const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)), f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  target.addScaledVector(r,-(cx-pinch.x)*k).addScaledVector(f,-(cy-pinch.y)*k);
  pinch.x=cx; pinch.y=cy; applyCam();}},{passive:false});
addEventListener('touchend',()=>pinch=null);
function td(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
document.getElementById('reset').onclick=()=>{dist=HOME.dist;yaw=HOME.yaw;pitch=HOME.pitch;target.copy(HOME.t);applyCam();};

/* ============================================================
   ВЫБОР
   ============================================================ */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let selected=null; const info=document.getElementById('info');
cv.addEventListener('click',e=>{ if(moved>6)return;
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(picks.filter(m=>m.parent&&m.parent.visible),false)[0];
  if(!hit){deselect();return;}
  let g=hit.object; while(g.parent&&!(g.userData&&g.userData.tag)) g=g.parent;
  if(!g.userData||!g.userData.tag){deselect();return;}
  select(g);});
function deselect(){ if(selected) selected.traverse(m=>{if(m.isMesh&&m.material.emissive)m.material.emissive.setHex(0x000000);});
  selected=null; info.style.display='none';}
function select(g){ deselect(); selected=g;
  g.traverse(m=>{if(m.isMesh&&m.material.emissive)m.material.emissive.setHex(0x1d3040);});
  const d=g.userData, z=ZONES[d.zone];
  const t=document.getElementById('i-tag'); t.textContent=d.tag; t.style.color='#'+z.c.toString(16).padStart(6,'0');
  document.getElementById('i-name').textContent=d.name||'';
  document.getElementById('i-zone').textContent='Участок '+z.n+' · '+z.t;
  document.getElementById('i-tbl').innerHTML=(d.spec||[]).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  info.style.display='block';}

/* ============================================================
   СЛОИ И УЧАСТКИ
   ============================================================ */
const zoneOn={}; Object.keys(ZONES).forEach(k=>zoneOn[k]=true);
const layerOn={zone:true, equip:true, pump:true, pipe:true};
function refresh(){
  reg.forEach(r=>{ r.g.visible = zoneOn[r.zone] && layerOn[r.layer]; });
  if (selected && !selected.visible) deselect();
}
const zonesEl=document.getElementById('zones');
Object.entries(ZONES).forEach(([k,z])=>{
  const row=document.createElement('label'); row.className='row';
  row.innerHTML=`<input type="checkbox" checked><span class="sw" style="background:#${z.c.toString(16).padStart(6,'0')}"></span>
    <span><span class="no">${z.n}</span> ${z.t}</span>`;
  const cb=row.querySelector('input');
  cb.onchange=()=>{ zoneOn[k]=cb.checked; row.classList.toggle('off',!cb.checked); refresh(); };
  zonesEl.appendChild(row);});
const layersEl=document.getElementById('layers');
[['equip','Аппараты'],['pump','Насосное оборудование'],['pipe','Трубопроводы'],['zone','Границы участков']]
.forEach(([k,t])=>{
  const row=document.createElement('label'); row.className='row';
  row.innerHTML=`<input type="checkbox" checked><span>${t}</span>`;
  const cb=row.querySelector('input');
  cb.onchange=()=>{ layerOn[k]=cb.checked; row.classList.toggle('off',!cb.checked); refresh(); };
  layersEl.appendChild(row);});
const legEl=document.getElementById('legend');
Object.values(PIPE).forEach(p=>{
  const d=document.createElement('div'); d.className='leg';
  d.innerHTML=`<span class="pl" style="background:#${p.c.toString(16).padStart(6,'0')}"></span>${p.t}`;
  legEl.appendChild(d);});
legEl.style.paddingBottom='6px';

/* ============================================================
   ОТРИСОВКА
   ============================================================ */
const v=new THREE.Vector3();
function frame(){
  renderer.render(scene,camera);
  for(const t of tagged){
    if(!zoneOn[t.zone]||!layerOn[t.layer]){t.el.style.display='none';continue;}
    v.set(t.obj.position.x,t.top+(t.small?1.6:2.6),t.obj.position.z).project(camera);
    const far=camera.position.distanceTo(t.obj.position);
    const lim=t.small?190:620;
    if(v.z>1||far>lim){t.el.style.display='none';continue;}
    t.el.style.display='block';
    t.el.style.left=((v.x*0.5+0.5)*innerWidth)+'px';
    t.el.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';
    t.el.style.opacity= far>lim*0.75?0.35:1;}
  for(const zl of zoneLabelEls){
    if(!zoneOn[zl.key]){zl.el.style.display='none';continue;}
    v.set(zl.z.cx,0.5,zl.z.mz2+4).project(camera);
    if(v.z>1){zl.el.style.display='none';continue;}
    zl.el.style.display='block';
    zl.el.style.left=((v.x*0.5+0.5)*innerWidth)+'px';
    zl.el.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';}
  requestAnimationFrame(frame);}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});

/* смена темы родительского интерфейса (без перезагрузки сцены) */
function applyTheme(t){
  const p = palOf(t === 'light' ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  scene.background.set(p.bg);
  scene.fog.color.set(p.fog);
  ground.material.color.set(p.ground);
  if (grid.setColors) grid.setColors(p.grid, p.grid2);
}
addEventListener('message', e => {
  if (e.data && e.data.type === 'elou-theme') applyTheme(e.data.theme);
});
})();
