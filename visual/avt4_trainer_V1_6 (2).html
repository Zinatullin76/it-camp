<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр оператора ЭЛОУ-АВТ-4</title>
<style>
:root{
  --bg:#0e1317; --panel:#151c22; --panel2:#1c252d; --line:#2a3540;
  --txt:#d7e3ea; --txt2:#8ba0ae; --acc:#4fd1c5;
  --ok:#3ec46d; --warn:#e8b93a; --alm:#e2483c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:13px/1.35 "Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:4px 10px;border-radius:3px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--acc)}
.btn.on{background:#1e4b48;border-color:var(--acc);color:#c5f6f0}
.btn.danger{border-color:#6d2a24;color:#f0a49c}
.btn.danger:hover{background:#57201b}
select,input[type=text],input[type=number]{background:#0c1114;border:1px solid var(--line);
  color:var(--txt);padding:3px 5px;border-radius:3px;font-size:12px}
input[type=number]{width:74px;font-family:Consolas,monospace}
.sep{width:1px;height:24px;background:var(--line)}
#top{display:flex;align-items:center;gap:10px;padding:5px 10px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.brand{font-weight:700;color:var(--acc);letter-spacing:.4px;line-height:1.1}
.brand small{display:block;font-weight:400;color:var(--txt2);letter-spacing:0;font-size:10.5px}
.clock{font-family:Consolas,monospace;color:var(--txt2)}
.kpi{font-family:Consolas,monospace;font-size:11.5px;color:var(--txt2)}
.kpi b{color:var(--txt)}
#tabs{display:flex;gap:2px;padding:0 8px;background:var(--panel2);border-bottom:1px solid var(--line);
  flex:0 0 auto;overflow-x:auto}
.tab{padding:7px 14px;font-size:12px;color:var(--txt2);cursor:pointer;border:1px solid transparent;
  border-bottom:none;white-space:nowrap;border-radius:4px 4px 0 0}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--bg);color:var(--acc);border-color:var(--line);box-shadow:inset 0 2px 0 var(--acc)}
#work{flex:1 1 auto;display:flex;min-height:0}
#scene{flex:1 1 auto;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 25%,#16202a 0%,#0c1115 72%)}
#svgwrap{position:absolute;inset:0;cursor:grab}
#svgwrap.drag{cursor:grabbing}
#svgwrap.edit{cursor:default;background-image:
  linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:20px 20px}
svg{display:block;width:100%;height:100%}
#side{flex:0 0 320px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:auto}
.sect>h4{margin:0;padding:5px 10px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--txt2);background:var(--panel2);border-bottom:1px solid var(--line)}
.sect .body{padding:8px 10px}
.hint{color:var(--txt2);font-size:11px}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0;gap:6px}
.lbl{color:var(--txt2)}
.val{font-family:Consolas,monospace;font-size:16px}
.tagname{font-family:Consolas,monospace;font-size:15px;color:var(--acc)}
.bar{height:8px;background:#0b0f12;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
input[type=range]{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#bottom{flex:0 0 168px;display:flex;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#almbar{flex:0 0 136px;display:flex;flex-direction:column;justify-content:space-between;
  padding:8px;border-right:1px solid var(--line)}
#almbar .cnt{font-family:Consolas,monospace;font-size:11px;color:var(--txt2);line-height:1.6}
.cnt b.p1{color:#ff8f84}.cnt b.p2{color:#f0cf7e}
#alm{flex:1 1 auto;overflow:auto}
.arow{padding:3px 10px;border-bottom:1px solid #1a232a;font-size:11.5px;display:flex;gap:10px}
.arow .t{color:var(--txt2);font-family:Consolas,monospace;flex:0 0 62px}
.arow.p1{color:#ffb3ab;background:#2b1512}
.arow.p2{color:#f3d68a}
.arow.p3{color:var(--txt2)}
.arow.ack{opacity:.45}
#trendwrap{flex:0 0 300px;border-left:1px solid var(--line);background:#0a0e11}
#modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:60}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:16px 20px;
  max-width:680px;max-height:82%;overflow:auto}
#modal h3{margin:0 0 8px}
#modal p,#modal li{color:var(--txt2);line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;padding:4px 10px;background:var(--panel2);
  border-top:1px solid var(--line);font-size:10.5px;color:var(--txt2);flex:0 0 auto}
.legend i{display:inline-block;width:15px;height:3px;vertical-align:middle;margin-right:4px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pal button{font-size:11px;padding:4px 2px}
</style>
</head>

<div id="app">

<div id="top">
  <div class="brand">ЭЛОУ-АВТ-4 · ТРЕНАЖЁР ОПЕРАТОРА<small>модель по техрегламенту и схеме КТС</small></div>
  <div class="sep"></div>

  <span class="clock" id="clock">00:00:00</span>

  <span class="lbl">Сценарий</span>

  <div class="sep"></div>

  <button class="btn" id="bFit">Вписать</button>
  <button class="btn danger" id="bStop">АВАРИЙНЫЙ ОСТАНОВ</button>
  <button class="btn" id="bHelp">Справка</button>
  <div class="sep"></div>

<div id="tabs"></div>

<div id="work">
  <div id="scene"><div id="svgwrap"></div>
    <div id="modal"><div class="box" id="modalBox"></div></div>
  </div>
  <div id="side">

  </div>
</div>

<div id="bottom">

  </div>
  <div id="alm"></div>

</div>

<div class="legend" id="legend"></div>
</div>

function pid(c,pv,dt){
 c.pv=pv; if(c.mode==="РУЧ")return c.out;
 const span=(c.hi-c.lo)||1, e=(c.sp-pv)*(c.rev?-1:1);
 c.i+=e/span*100*(dt/Math.max(c.ti,1)); c.i=Math.max(-60,Math.min(60,c.i));
 c.out=Math.max(0,Math.min(100,50+c.kp*(e/span*100)*.6+c.i));
 return c.out;
}
const lag=(x,tg,dt,tau)=>x+(tg-x)*(1-Math.exp(-dt/tau));

function step(dt){
 S.t+=dt;

const ALARMS=[],active={};
function raise(k,p,txt){if(active[k])return;active[k]=true;
 ALARMS.unshift({t:fmtT(S.t),p:p,txt:txt,ack:false});if(ALARMS.length>250)ALARMS.pop();renderAlarms();}
function ck(k,cond,p,txt){cond?raise(k,p,txt):(active[k]=false);}
function fmtT(s){const f=n=>String(Math.floor(n)).padStart(2,"0");
 return f(s/3600%24)+":"+f(s/60%60)+":"+f(s%60);}
function checkAlarms(){
 ck("P204a",S.P204>=4.5,1,"PRSA 204 · давление в К-1 ≥ 4,5 кгс/см² — сигнализация");
 if(S.P204>=4.8&&!S.blkFuel){S.blkFuel=true;raise("P204b",1,
  "БЛОКИРОВКА PRSA 204 · P(К-1) ≥ 4,8 кгс/см²: отсечение жидкого и газообразного топлива и бутана, прекращение подачи перегретого пара в К-2 и К-3/1, прекращение подачи теплоносителя в Т-1К");}

  "БЛОКИРОВКА PRSA 213 · P(К-2) ≥ 1,5 кгс/см²: отсечение топлива и бутана на установку");}
 if(S.L603<15&&!S.blkH6){S.blkH6=true;raise("L603b",1,
  "БЛОКИРОВКА LRCSA 603 / LRSA 603В · уровень в Е-1 ниже 15 %: останов насосов Н-6 (Н-6А)");}
 if(S.L604<15&&!S.blkH4){S.blkH4=true;raise("L604b",1,

 if(S.Lint<8&&!S.blkED){S.blkED=true;raise("EDb",1,
  "БЛОКИРОВКА · газовая подушка в электродегидраторе: снятие напряжения с электродов");}
 ck("Lint",S.Lint<20,2,"Уровень раздела фаз в электродегидраторах ниже 20 %");
 ck("L602",S.L602<20,2,"LRCA 602 / LR 602А, LR 602В · уровень в кубе К-1 ниже 20 % (п. 7.7.1.14)");
 ck("L602h",S.L602>88,2,"LRCA 602 · высокий уровень в кубе К-1");
 if(S.L602<15&&!S.blkH2){S.blkH2=true;raise("L602b",1,

 ck("TK1b",S.T_K1bot>280,2,"TRC 4 · температура низа К-1 выше 280 °С (рабочие условия колонны)");
 ck("L603l",S.L603<20,2,"LRCSA 603 / LRSA 603В · уровень нефтепродукта в Е-1 ниже 20 % (п. 7.7.1.14)");
 ck("L603h",S.L603>88,2,"LRCSA 603 · высокий уровень нефтепродукта в Е-1");
 ck("L603wh",S.L603w>80,2,"LRCA 603А · высокий уровень раздела фаз в Е-1: возможен унос воды с острым орошением в К-1 и резкий рост давления (п. 7.10.4)");

const T=(x,y,s,size,fill,anchor)=>
 '<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||"middle")+'" font-size="'+(size||10)+

const ST='fill="#1b242c" stroke="#7d97a8" stroke-width="1.5"';

function sym(e){
 let s="",x=e.x,y=e.y,w=e.w||60,h=e.h||30;
 switch(e.t){
 case "col":{
  const r=w/2, hd=r*.55, sump=e.sump||0, N=e.tr==null?10:e.tr;

      '" fill="#16202a" opacity=".85"/>';

   s+='<line x1="'+(x+1)+'" y1="'+tBot+'" x2="'+(x+w-1)+'" y2="'+tBot+
      '" stroke="#7d97a8" stroke-width="1.3" stroke-dasharray="5 4"/>';

  const mk=e.marks||[];
  for(let i=1;i<=N;i++){

  if(e.s)s+=T(x+w/2,y-10,e.s,9.5,"#7d94a3");

 case "vves":{ /* вертикальный аппарат с разделом фаз */
  const r=w/2, hd=r*.5, b=y+h-4, top=y+hd+2;

  const dt2='data-lv="'+(e.lv||"")+'" data-lw="'+(e.lvw||"")+'" data-b="'+b+'" data-hh="'+(b-top)+'"';

 case "ves": case "sett": case "ed":{

   s+='<path class="hv" d="M'+(x+w/2-6)+' '+(y-14)+' l6 8 l-4 1 l6 8" fill="none" stroke="#e8b93a" stroke-width="1.6"/>';

  s+=T(x+w/2,e.t==="ed"?y+h-7:y+h/2+4,e.n,11,"#eef6fa");

 case "mix":
  s+='<circle cx="'+x+'" cy="'+y+'" r="13" '+ST+'/>';
  s+='<path d="M'+(x-8)+' '+(y-8)+' L'+(x+8)+' '+(y+8)+' M'+(x-8)+' '+(y+8)+' L'+(x+8)+' '+(y-8)+
     '" stroke="#7d97a8" stroke-width="1.4"/>';
  s+=T(x,y+27,e.n,9,"#9db3c0"); break;
 case "hx": /* кожухотрубчатый теплообменник, ГОСТ 2.789 */
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(h/2)+'" '+ST+'/>';
  s+='<line x1="'+(x+8)+'" y1="'+(y+h/2)+'" x2="'+(x+w-8)+'" y2="'+(y+h/2)+'" stroke="#9fb6c4" stroke-width="1.6"/>';

  s+='<line x1="'+(x+w*.66)+'" y1="'+(y+h)+'" x2="'+(x+w*.66)+'" y2="'+(y+h+6)+'" stroke="#7d97a8" stroke-width="1.4"/>';
  s+=T(x+w/2,y+h/2-5,e.n,10,"#e3eef4");
  if(e.s)s+=T(x+w/2,y+h+16,e.s,8.5,"#7d94a3"); break;
 case "air":{ /* аппарат воздушного охлаждения */
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" '+ST+'/>';

  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="#241b1b" stroke="#96604c" stroke-width="1.6"/>';

 case "valve":{ /* арматура, ГОСТ 2.785 */

   s+='<rect class="cvf" data-c="'+e.ctrl+'" x="'+(x-11)+'" y="'+(y-19.5)+'" width="0" height="3.4" fill="#4fd1c5"/>';
  }else if(e.vt==="psv"){

function bbox(e){

 if(e.t==="mix")return[e.x-15,e.y-15,30,45];
 if(e.t==="valve")return[e.x-16,e.y-22,32,50];

  h+='<path class="ph" data-p="'+i+'" d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+

     (selPipe===i?1:(sig?.85:.9))+'"'+(editMode?' style="cursor:pointer"':'')+'/>';
  if(sig&&p.pts.length){
   /* отборное устройство — место установки датчика на аппарате или трубопроводе */
   h+='<circle cx="'+p.pts[0][0]+'" cy="'+p.pts[0][1]+'" r="3.6" fill="'+col+
      '" stroke="#0e1317" stroke-width="1.1" pointer-events="none"/>';

 });
 h+='</g><g>';
 sc.items.forEach(function(e,i){
  const bb=bbox(e);
  h+='<g class="it" data-i="'+i+'"'+(editMode?' style="cursor:move"':(e.ctrl?' style="cursor:pointer"':''))+'>';
  h+=sym(e);

     '" fill="transparent" stroke="'+(selEl===i?"#4fd1c5":"none")+'" stroke-dasharray="4 3"/></g>';

 h+='</g>';
 if(editMode&&selPipe!=null&&sc.pipes[selPipe])
  h+='<g>'+sc.pipes[selPipe].pts.map((q,j)=>'<rect class="vt" data-v="'+j+'" x="'+(q[0]-5)+

function toSvg(ev){
 const r=svg.getBoundingClientRect();
 const k=Math.max(vb[2]/r.width,vb[3]/r.height);
 return{x:vb[0]+vb[2]/2+(ev.clientX-(r.left+r.width/2))*k,
        y:vb[1]+vb[3]/2+(ev.clientY-(r.top+r.height/2))*k};
}
function bindScene(){
 const sc=SCREENS[cur];
 svg.querySelectorAll(".it").forEach(function(g){
  const i=+g.dataset.i,e=sc.items[i];
  g.addEventListener("mousedown",function(ev){
   if(editMode){ev.stopPropagation();selEl=i;selPipe=null;dragItem(ev,e);renderEditor();render();}});
  g.addEventListener("click",function(ev){
   if(!editMode&&e.ctrl){ev.stopPropagation();openFP(e.ctrl);}});
 });
 if(editMode){
  svg.querySelectorAll(".ph").forEach(p=>p.addEventListener("mousedown",function(ev){
   ev.stopPropagation();selPipe=+p.dataset.p;selEl=null;renderEditor();render();}));
  svg.querySelectorAll(".vt").forEach(v=>v.addEventListener("mousedown",function(ev){
   ev.stopPropagation();dragVert(ev,+v.dataset.v);}));
 }
}
const snap=(v,ev)=>ev.shiftKey?Math.round(v):Math.round(v/5)*5;
function dragItem(ev,e){
 const st=toSvg(ev),ox=e.x,oy=e.y;
 function mv(m){const p=toSvg(m);e.x=snap(ox+p.x-st.x,m);e.y=snap(oy+p.y-st.y,m);render();}
 function up(){window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);renderEditor();}
 window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);
}
function dragVert(ev,j){
 const pts=SCREENS[cur].pipes[selPipe].pts;
 function mv(m){const p=toSvg(m);pts[j]=[snap(p.x,m),snap(p.y,m)];render();}
 function up(){window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);}
 window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);
}
function initPanZoom(){
 const w=document.getElementById("svgwrap");
 let dr=false,sx,sy,o;
 w.addEventListener("mousedown",function(e){
  if(editMode&&e.target.closest(".it,.ph,.vt"))return;
  dr=true;sx=e.clientX;sy=e.clientY;o=vb.slice();w.classList.add("drag");});
 window.addEventListener("mouseup",function(){dr=false;w.classList.remove("drag");});
 window.addEventListener("mousemove",function(e){if(!dr)return;
  const k=vb[2]/w.clientWidth;setVB([o[0]-(e.clientX-sx)*k,o[1]-(e.clientY-sy)*k,o[2],o[3]]);});
 w.addEventListener("wheel",function(e){e.preventDefault();
  const k=e.deltaY>0?1.12:.89,r=w.getBoundingClientRect();
  const mx=vb[0]+(e.clientX-r.left)/r.width*vb[2],my=vb[1]+(e.clientY-r.top)/r.height*vb[3];
  setVB([mx-(mx-vb[0])*k,my-(my-vb[1])*k,vb[2]*k,vb[3]*k]);},{passive:false});
 w.addEventListener("click",function(e){
  if(!editMode)return;
  if(newPipe&&!e.target.closest(".it,.vt")){const p=toSvg(e);
   newPipe.pts.push([Math.round(p.x/5)*5,Math.round(p.y/5)*5]);render();return;}
  if(!e.target.closest(".it,.ph,.vt")){selEl=null;selPipe=null;renderEditor();render();}});
}

const HIST={},HKEYS={"Расход сырья":"Fcrude","P К-1":"P204","P К-2":"P213","T верха К-2":"T_K2top","Уровень Е-1":"L603"};
function drawTrend(){
 const cv=document.getElementById("trend"),g=cv.getContext("2d");
 g.clearRect(0,0,cv.width,cv.height);g.strokeStyle="#182129";g.lineWidth=1;
 for(let i=1;i<5;i++){g.beginPath();g.moveTo(0,i*33);g.lineTo(cv.width,i*33);g.stroke();}
 const cols=["#4fd1c5","#e05252","#4fc3f7","#e3d24a","#7dc95e"];
 Object.keys(HKEYS).forEach(function(k,i){const a=HIST[k];if(!a||a.length<2)return;
  const mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),r=(mx-mn)||1;
  g.strokeStyle=cols[i];g.lineWidth=1.3;g.beginPath();
  a.forEach(function(v,j){const x=j/300*cv.width,y=cv.height-10-((v-mn)/r)*(cv.height-30);
   j?g.lineTo(x,y):g.moveTo(x,y);});
  g.stroke();g.fillStyle=cols[i];g.font="9.5px Segoe UI";
  g.fillText(k+" "+a[a.length-1].toFixed(1),5,12+i*11);});
}

 e.target.textContent=S.run?"⏸ Пауза":"▶ Пуск";e.target.classList.toggle("on",S.run);};
document.getElementById("speed").onchange=function(e){S.speed=+e.target.value;};
document.getElementById("bFit").onclick=function(){setVB(SCREENS[cur].vb);};
document.getElementById("bEdit").onclick=function(e){
 editMode=!editMode;e.target.classList.toggle("on",editMode);
 e.target.textContent=editMode?"✓ Завершить правку":"✎ Редактировать схему";
 document.getElementById("secEd").style.display=editMode?"":"none";
 document.getElementById("secFP").style.display=editMode?"none":"";
 document.getElementById("svgwrap").classList.toggle("edit",editMode);
 selEl=null;selPipe=null;newPipe=null;

 render();};
document.getElementById("bAck").onclick=function(){
 ALARMS.forEach(a=>a.ack=true);
 S.blkFuel=false;S.blkH6=false;S.blkH4=false;S.blkH2=false;S.blkED=false;
 ["P204b","P213b","L603b","L604b","L602b","EDb"].forEach(k=>active[k]=false);renderAlarms();};
document.getElementById("bStop").onclick=function(){S.esd=true;
 raise("esd"+Date.now(),1,"АВАРИЙНЫЙ ОСТАНОВ: отсечение топлива и сырья, останов насосов, перевод оборудования в безопасное состояние");};
document.getElementById("scen").onchange=function(e){
 const v=e.target.value;
 S.fuelP=1;S.waterInFeed=.5;S.cwX1=1;S.avz45=1;S.pumpH6=true;S.edVolt=true;S.esd=false;
 const M={fuel:[{fuelP:.55},"Сценарий: давление топливного газа к форсункам печей снижено до 55 % от нормы"],
  water:[{waterInFeed:3},"Сценарий: обводнение сырья до 3 % — рост нагрузки на блок ЭЛОУ"],
  cw:[{cwX1:.25},"Сценарий: прекращена подача оборотной воды на конденсаторы Х-1/3, 4, 5"],
  avz:[{avz45:.2},"Сценарий: остановлены вентиляторы АВЗ-4, АВЗ-5"],
  pump:[{pumpH6:false},"Сценарий: отказ насоса Н-6 (Н-6А)"],
  ed:[{edVolt:false},"Сценарий: снято напряжение с электродов Э-2, Э-4, Э-6"],
  e1w:[{},"Сценарий: клапан LRCA 603А закрыт — прекращён сброс воды из Е-1, растёт уровень раздела фаз"],
  h6k:[{},"Сценарий: остановлены насосы Н-6К (Н-6К/1) — прекращены циркуляционное орошение К-1 и отбор фр. 40-180 °С с 26 тарелки"]};
 CTRL["LRCA 603А"].mode="АВТ";CTRL["FRC 3K-32"].mode="АВТ";CTRL["FRC 3K-33"].mode="АВТ";
 if(v==="e1w"){CTRL["LRCA 603А"].mode="РУЧ";CTRL["LRCA 603А"].out=0;}
 if(v==="h6k"){["FRC 3K-32","FRC 3K-33"].forEach(function(t){CTRL[t].mode="РУЧ";CTRL[t].out=0;});}
 if(M[v]){Object.assign(S,M[v][0]);raise("sc"+Date.now(),3,M[v][1]);}
 else raise("sc"+Date.now(),3,"Установлен нормальный технологический режим");};
document.getElementById("bHelp").onclick=function(){
 document.getElementById("modalBox").innerHTML='<h3>Работа с тренажёром</h3>'+
 '<p><b>Вкладки сверху</b> — участки установки: сырьё и ЭЛОУ; подогрев обессоленной нефти и К-1; печи П-1, П-2, П-3; К-2 со стриппингами и мазутом; стабилизация К-4 и К-7; вторичная перегонка К-9, К-10 и П-4. Вкладка «Общий вид» собирает всю цепочку целиком.</p>'+
 '<p><b>Регуляторы.</b> Нажмите на прибор с бирюзовой окружностью или на регулирующий клапан — справа откроется фейсплейт: измерение, задание, положение клапана, переключение АВТ/РУЧ. Задание меняется полем ввода или ползунком; в режиме РУЧ клапан задаётся вручную.</p>'+
 '<p><b>Редактор схемы.</b> Кнопка «Редактировать схему» включает правку: элементы перетаскиваются мышью с привязкой к сетке 5 px (Shift — свободно). В панели справа задаются название, размеры, цвет потока, число тарелок, привязка к уровню, контуру или параметру модели. Трубопроводы: выберите линию — появятся маркеры вершин; «+ Трубопровод» позволяет проложить новую линию щелчками по полю, завершить — той же кнопкой или Esc. Кнопка «⋯ Линия связи» рисует тонкий пунктир для обозначения точки установки датчика: закрашенный кружок в начале линии — отборное устройство на аппарате или трубопроводе, светлый кружок в конце — привязка к бирке прибора. Такая линия не участвует в модели и служит только для разметки схемы. Схема выгружается в JSON и загружается обратно.</p>'+
 '<p><b>Колонна К-1 на схеме</b> показана в разрезе: кубовый отсек внизу (в нём находится отбензиненная нефть, уровень LRCA 602), 28 клапанных тарелок, 26-я «глухая» тарелка с карманом жидкости (уровень LR 4K-28), отмеченные номерами тарелки ввода и отбора. Ёмкость Е-1 — вертикальный аппарат-водоотделитель: верхний слой нефтепродукта (LRCSA 603), нижний слой воды и пунктирная линия раздела фаз (LRCA 603А), клапан сброса воды в сернисто-щелочную канализацию.</p>'+'<p><b>УГО по ГОСТ:</b> кожухотрубчатые теплообменники и конденсаторы-холодильники с трубными решётками и штуцерами трубного и межтрубного пространства; аппараты воздушного охлаждения с вращающимся вентилятором; трубчатые печи со змеевиком и дымовой трубой; центробежные насосы; задвижки, регулирующие клапаны с мембранным исполнительным механизмом и индикацией хода, обратные и предохранительные клапаны; приборы отображаются компактными бирками: позиция и текущее измерение. Пометки НО, НЗ и «ручн.» соответствуют схеме КТС.</p>'+
 '<p><b>Блокировки и сигнализации по К-1 и Е-1:</b> PRSA 204 — сигнализация при 4,5 кгс/см², блокировка при 4,8 кгс/см² (отсечение жидкого и газообразного топлива и бутана на установку, прекращение подачи перегретого пара в К-2 и К-3/1, прекращение подачи теплоносителя в Т-1К); LRCSA 603 и LRSA 603В ниже 15 % — останов насосов Н-6 (Н-6А); LRCA 602 ниже 15 % — сброс печных насосов Н-2 (Н-2А, Н-2Б) и Н-3 (Н-3А) с прекращением циркуляции по змеевикам печей (п. 7.10.3); LRCA 603А — сигнализация по минимуму и максимуму уровня раздела фаз в Е-1: высокий уровень ведёт к уносу воды с острым орошением и росту давления в К-1 (п. 7.10.4), низкий — к прорыву бензина в канализацию (п. 7.10.5). Рабочие условия К-1: давление верха 1–4,5 кгс/см², температура верха не выше 150 °С, температура низа не выше 280 °С; перегретый пар в низ К-1 не более 1200 кг/ч. Прочие блокировки: PRSA 213 — 1,0 и 1,5 кгс/см²; LRSA 604А ниже 15 % — запрет пуска Н-4 и Н-32; газовая подушка в электродегидраторе — снятие напряжения; уровни ниже 20 % по п. 7.7.1.14.</p>'+
 '<p><b>Квитирование</b> — кнопка в левом нижнем углу: снимает подсветку сообщений и сбрасывает сработавшие блокировки.</p>'+
 '<button class="btn" id="mc" style="margin-top:10px">Закрыть</button>';
 document.getElementById("modal").style.display="flex";
 document.getElementById("mc").onclick=function(){document.getElementById("modal").style.display="none";};};
document.getElementById("legend").innerHTML=Object.keys(FLOW).map(k=>
 '<span><i style="'+(k==="sig"
   ?'background:none;border-top:2px dashed '+FLOW[k].c+';height:0'
   :'background:'+FLOW[k].c)+'"></i>'+FLOW[k].n+'</span>').join("");
window.addEventListener("keydown",function(e){
 if(!editMode)return;
 if(e.key==="Delete"&&(selEl!=null||selPipe!=null)){
  const sc=SCREENS[cur];
  if(selEl!=null)sc.items.splice(selEl,1);else sc.pipes.splice(selPipe,1);
  selEl=null;selPipe=null;renderEditor();render();}
 if(e.key==="Escape"&&newPipe){
  const sc=SCREENS[cur];
  if(newPipe.pts.length<2&&sc.pipes[sc.pipes.length-1]===newPipe)sc.pipes.pop();
  newPipe=null;selPipe=null;renderEditor();render();}});

/* ==========================================================================
   11. ЦИКЛ
   ========================================================================== */
buildTabs();setVB(SCREENS[cur].vb);render();initPanZoom();renderAlarms();buildFP();
let last=performance.now();
(function loop(now){
 const real=(now-last)/1000;last=now;
 if(S.run){const n=Math.max(1,Math.ceil(S.speed/5)),dt=Math.min(real,.2)*S.speed/n;
  for(let i=0;i<n;i++)step(dt);}
 update();requestAnimationFrame(loop);
})(performance.now());
</script>
