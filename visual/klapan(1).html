<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО клапана</title>
<style>
  :root{
    /* Палитра по Приказу № 251-П, Приложение №1 */
    --bg:   #CCCCCC;   /* фон мнемосхемы            */
    --norm: #D7D7D7;   /* нормальное/статичное обор. */
    --line: #000000;   /* контур, нефтепродукт       */
  }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
  }

  .mnemo{ display:inline-block; padding:24px; }

  /* ---- УГО клапана ---- */
  .valve{ display:block; }

  .valve .valve__pipe{
    fill:none;
    stroke:var(--line);
    stroke-width:2.4;
    stroke-linecap:butt;
  }

  .valve .valve__body{
    fill:var(--norm);
    stroke:var(--line);
    stroke-width:2.4;
    stroke-linejoin:round;
  }

  .valve .valve__spring{
    fill:none;
    stroke:var(--line);
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
</style>
</head>
<body>

<div class="mnemo">

  <!-- =========== УГО клапана =========== -->
  <svg class="valve" xmlns="http://www.w3.org/2000/svg"
       width="100" height="104" viewBox="0 0 100 104">
    <title>Клапан</title>

    <!-- ---- ПОДВОД / ОТВОД / ШТОК (до тела клапана) ---- -->
    <g class="valve__pipe" fill="none" stroke="#000000" stroke-width="2.4">
      <!-- вход (слева) -->
      <line x1="2"  y1="48" x2="36" y2="48"/>
      <!-- отвод (вниз) -->
      <line x1="66" y1="76" x2="66" y2="100"/>
      <!-- шток привода (вверх) -->
      <line x1="66" y1="48" x2="66" y2="26"/>
    </g>

    <!-- ---- ТЕЛО КЛАПАНА ---- -->
    <path class="valve__body" d="M 34,34 L 34,62 L 66,48 Z"
          fill="#D7D7D7" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>
    <path class="valve__body" d="M 48,78 L 84,78 L 66,48 Z"
          fill="#D7D7D7" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- ---- ПРИВОД (пружина) ---- -->
    <path class="valve__spring" d="M 66,26 L 78,17 L 64,11"
          fill="none" stroke="#000000" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

</div>

</body>
</html>
