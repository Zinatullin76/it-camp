<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>АВО — авария</title>
<style>
    :root{
      --clr-run:#00AF50;
      --clr-stop:#BEBEBE;
      --clr-alarm:#FF0000;
      --clr-idle:#F0F0F0;
      --clr-line:#2C2C2A;
      --clr-body:#D7D7D7;
      --clr-bg:#CCCCCC;
    }
    body{margin:0;padding:24px;background:var(--clr-bg);font:12px/1.4 Arial,sans-serif;color:var(--clr-line)}
    .cell{width:150px;text-align:center;margin:0}
    .cell figcaption{margin-top:6px}

    .avo{display:block;width:100%;height:auto}
    .avo .bundle{fill:var(--clr-body);stroke:var(--clr-line);stroke-width:2}
    .avo .coil{fill:none;stroke:var(--clr-line);stroke-width:2}
    .avo .blade,.avo .motor,.avo .mount{stroke:var(--clr-line);stroke-width:2.5;stroke-linejoin:round}
    .avo .hub{fill:var(--clr-line)}
    .avo .mount{fill:var(--clr-stop)}

    .avo .blade{fill:var(--clr-idle)}
    .avo .motor{fill:var(--clr-stop)}

    .avo.is-run .blade{fill:var(--clr-run)}
    .avo.is-run .motor{fill:var(--clr-run)}

    .avo.is-starting .blade{animation:blink-blade-run 1s steps(1,end) infinite}

    .avo.is-fail-start .blade{fill:var(--clr-run)}
    .avo.is-fail-start .motor{animation:blink-motor-run 1s steps(1,end) infinite}

    .avo.is-fail-stop .blade{fill:var(--clr-idle)}
    .avo.is-fail-stop .motor{animation:blink-motor-stop 1s steps(1,end) infinite}

    .avo.is-alarm .blade{animation:blink-blade-alarm 1s steps(1,end) infinite}
    .avo.is-alarm .motor{animation:blink-motor-alarm 1s steps(1,end) infinite}

    @keyframes blink-blade-run{0%{fill:var(--clr-run)}50%{fill:var(--clr-idle)}}
    @keyframes blink-motor-run{0%{fill:var(--clr-alarm)}50%{fill:var(--clr-run)}}
    @keyframes blink-motor-stop{0%{fill:var(--clr-alarm)}50%{fill:var(--clr-stop)}}
    @keyframes blink-blade-alarm{0%{fill:var(--clr-alarm)}50%{fill:var(--clr-idle)}}
    @keyframes blink-motor-alarm{0%{fill:var(--clr-alarm)}50%{fill:var(--clr-stop)}}

    @media (prefers-reduced-motion:reduce){
      .avo.is-starting .blade{animation:none;fill:var(--clr-run)}
      .avo.is-fail-start .motor,.avo.is-fail-stop .motor,.avo.is-alarm .motor{animation:none;fill:var(--clr-alarm)}
      .avo.is-alarm .blade{animation:none;fill:var(--clr-alarm)}
    }
</style>
</head>
<body>
  <figure class="cell">
    <svg class="avo is-alarm" viewBox="262 12 156 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="АВО, авария">
      <rect class="bundle" x="262.54" y="18" width="152.29" height="24" fill="#D7D7D7" stroke="#2C2C2A" stroke-width="2"/>
      <path class="coil" d="m270.12,38l15.74,-16l22.04,16l22.04,-16l22.04,16l22.04,-16l22.04,16l12.59,-12" fill="none" stroke="#2C2C2A" stroke-width="2"/>
      <circle class="motor" cx="339.15" cy="86.41" r="24.05" fill="#FF0000" stroke="#2C2C2A" stroke-width="2.5"/>
      <path class="blade" d="m339,61.31c-15.59,-6.38 -31.19,-12.77 -43.32,-12.13c-7.8,0.64 -11.26,5.75 -6.06,9.58c7.8,5.11 33.79,5.75 49.38,2.55z" transform="rotate(-7,313.07,56.2)" fill="#FF0000" stroke="#2C2C2A" stroke-width="2.5" stroke-linejoin="round"/>
      <path class="blade" d="m392.03,64.52c-15.59,-6.38 -31.19,-12.77 -43.32,-12.13c-7.8,0.64 -11.26,5.75 -6.06,9.58c7.8,5.11 33.79,5.75 49.38,2.55z" transform="rotate(170,366.1,59.4)" fill="#FF0000" stroke="#2C2C2A" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon class="mount" points="340,64.34 330.56,79.36 349.45,79.36" fill="#BEBEBE" stroke="#2C2C2A" stroke-width="2.5" stroke-linejoin="round"/>
      <circle class="hub" cx="340" cy="59.2" r="3.5" fill="#2C2C2A"/>
    </svg>
    <figcaption>авария</figcaption>
  </figure>
</body>
</html>
