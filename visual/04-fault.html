<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аналоговый датчик — Отказ оборудования / Неисправность</title>
<style>
/* ---- Мнемоэлемент "Аналоговый датчик" ----
   Поле значения ВСЕГДА тёмно-серое (#535353).
   Цвет состояния несёт подложка с позицией и рамка вокруг поля значения. */
*, *::before, *::after { box-sizing: border-box; }

.mnemo {
  /* ВАЖНО: переменные НЕ объявляются здесь — иначе они перебьют
     значения, унаследованные от контейнера .state-*.
     Значения по умолчанию заданы как fallback внутри var(). */
  display: inline-block;
  width: 82px;
  padding: 3px;
  background: var(--frame, #e6e6e6);
  border: 1px solid rgba(0, 0, 0, .35);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1;
  user-select: none;
}

.mnemo .tag {
  height: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px;
  color: var(--tag-fg, #000);
}

/* серое поле значения в цветной рамке состояния */
.mnemo .val {
  height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: var(--val-bg, #535353);
  color: var(--val-fg, #fff);
  font-size: 15px;
  border: 1px solid var(--frame, #e6e6e6);
}
.mnemo .val.text { font-size: 12px; letter-spacing: .3px; }

.mnemo .unit {
  height: 7px;
  text-align: right;
  font-size: 5px;
  color: var(--unit-fg, #333);
  padding-right: 1px;
}

/* ---- Вариант ПАЗ: жёлтый ромб слева ---- */
.mnemo-paz { display: inline-flex; align-items: center; gap: 2px; }
.mnemo-paz .diamond {
  width: 12px; height: 12px;
  background: var(--diamond, #ffe600);
  border: 1px solid #000;
  transform: rotate(45deg);
  flex: 0 0 auto;
}
.mnemo-paz .diamond.hidden { visibility: hidden; }

/* ---- Упрощённый вариант: без единиц измерения ---- */
.mnemo-simple .unit { display: none; }

/* ---- Шкала ---- */
.scale {
  width: 22px; height: 86px;
  border: 1.5px solid var(--scale-border, #000);
  display: flex; flex-direction: column;
  background: #fff;
}
.scale .seg-top  { height: 30%; background: #d9d9d9; }
.scale .seg-mark { height: 14%; background: #000; }
.scale .seg-fill { height: 56%; background: var(--scale-fill, #7ba7d7); }
.scale.hatched {
  background: repeating-linear-gradient(45deg, var(--hatch) 0 3px, #fff 3px 7px);
}
.scale.hatched > *, .scale.empty > * { display: none; }
.scale.hidden { display: none; }

/* ---- Демонстрационная страница ---- */
body { margin: 0; padding: 24px; font-family: Arial, Helvetica, sans-serif; background: #fff; color: #111; }
h1 { font-size: 16px; margin: 0 0 4px; }
h1 small { font-weight: normal; color: #666; font-size: 12px; }
.grid { display: flex; gap: 34px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.item { text-align: center; }
.item .cap { margin-top: 8px; font-size: 10px; color: #666; }


/* ---- Состояние: Отказ оборудования / Неисправность ---- */
.state-fault {
  --frame: #ffa400;
  --val-bg: #535353;
  --val-fg: #ffa400;
  --tag-fg: #000000;
  --unit-fg: #333333;
  --diamond: #ffe600;
  --scale-border: #000000;
  --hatch: #ffa400;
}
</style>
</head>
<body class="state-fault">

  <h1>Аналоговый датчик <small>— Отказ оборудования / Неисправность</small></h1>

  <div class="grid">
    <div class="item">
      <div class="mnemo-paz"><i class="diamond"></i><div class="mnemo">
        <div class="tag">PZIRA-101</div>
        <div class="val text">ОТКАЗ</div>
        <div class="unit">МПа</div>
      </div></div>
      <div class="cap">ПАЗ</div>
    </div>

    <div class="item">
      <div class="mnemo">
        <div class="tag">PIRSA-101</div>
        <div class="val text">ОТКАЗ</div>
        <div class="unit">МПа</div>
      </div>
      <div class="cap">РСУ</div>
    </div>

    <div class="item">
      <div class="scale hatched"></div>
      <div class="cap">Шкала</div>
    </div>

    <div class="item">
      <div class="mnemo mnemo-simple">
        <div class="tag">PIRSA-101</div>
        <div class="val text">ОТКАЗ</div>
        <div class="unit">МПа</div>
      </div>
      <div class="cap">Упрощённый вариант</div>
    </div>
  </div>

</body>
</html>
