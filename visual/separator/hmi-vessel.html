<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>УГО ёмкости, шкала уровня и состояния</title>
<style>
/* ============================================================
   1. Палитра — приложение №1 приказа № 251-П от 17.06.2026
   ============================================================ */
:root {
  /* Табл.11 — элементы интерфейса */
  --c-mnemo-bg:  #cccccc;   /* (204,204,204) фон мнемосхемы */
  --c-blue:      #5b9bd4;   /* (91,155,212)  голубой        */

  /* Табл.12 — состояния */
  --c-normal:    #d7d7d7;   /* (215,215,215) норма          */
  --c-alarm:     #ff0000;   /* (255,0,0)     авария         */
  --c-warning:   #ffff00;   /* (255,255,0)   предупреждение */

  /* Табл.13 — среды. В таблице заданы только образцы-плашки
     без кодов RGB/Hex — значения ниже подставить по исходнику. */
  --c-med-oil:   #000000;            /* нефть и нефтепродукты */
  --c-med-water: var(--c-blue);      /* неопасные жидкости    */
  --c-med-gas:   var(--c-normal);    /* газовая подушка       */

  /* Контур оборудования */
  --c-stroke:    #000000;
  --line:        2px;
}

/* ============================================================
   2. Шкала уровня — столбиковый индикатор
   Газовая подушка сверху, продукт, вода снизу.
   Рамка кодирует состояние параметра по уставкам (п. 7.4.2.6)
   и мигает до квитирования события.
   ============================================================ */
.gauge {
  --gauge-w: 26px;
  --gauge-h: 150px;

  --gauge-gas:    var(--c-med-gas);
  --gauge-liquid: var(--c-med-oil);
  --gauge-water:  var(--c-med-water);

  --frame:     var(--c-stroke);   /* цвет рамки в текущем состоянии */
  --frame-alt: var(--c-stroke);   /* второй цвет при мигании        */

  --level: 62%;                   /* рабочий уровень                */
  --interface: 0%;                /* уровень раздела фаз, 0 — нет   */

  position: relative;
  width: var(--gauge-w);
  height: var(--gauge-h);
  box-sizing: border-box;
  background: var(--gauge-gas);
  border: var(--line) solid var(--frame);
  overflow: hidden;
}

.gauge__fill {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  transition: height .4s ease;
}
.gauge__fill--liquid { height: var(--level);     background: var(--gauge-liquid); }
.gauge__fill--water  { height: var(--interface); background: var(--gauge-water);  }

/* состояния параметра, Табл.12 */
.gauge--norm    { --frame: var(--c-stroke);  }
.gauge--warning { --frame: var(--c-warning); }
.gauge--alarm   { --frame: var(--c-alarm);   }

/* мигание до квитирования: 1 раз в 1 с цветом состояния и серым.
   Класс снимается по факту квитирования оператором. */
.gauge.is-unacked { animation: gauge-blink 1s steps(1, end) infinite; }

@keyframes gauge-blink {
  0%,   50% { border-color: var(--frame);     }
  50%, 100% { border-color: var(--frame-alt); }
}

/* ============================================================
   3. УГО горизонтальной ёмкости
   2D-отображение, пропорциональное реальному аппарату
   (п. 7.4.8.2 «г», «д»).
   ============================================================ */
.vessel {
  --vessel-w: 490px;
  --vessel-h: 250px;
  --vessel-head: 110px;                 /* ширина эллиптического днища */
  --vessel-fill: var(--c-normal);
  --vessel-stroke: var(--c-stroke);     /* контур в текущем состоянии  */

  position: relative;
  width: var(--vessel-w);
  height: var(--vessel-h);
  box-sizing: border-box;
}

/* эллиптические днища */
.vessel__head {
  position: absolute;
  top: 0;
  width: var(--vessel-head);
  height: 100%;
  box-sizing: border-box;
  background: var(--vessel-fill);
  border: var(--line) solid var(--vessel-stroke);
  border-radius: 50%;
}
.vessel__head--left  { left: 0;  }
.vessel__head--right { right: 0; }

/* обечайка перекрывает внутренние половины днищ */
.vessel__shell {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(var(--vessel-head) / 2);
  right: calc(var(--vessel-head) / 2);
  box-sizing: border-box;
  background: var(--vessel-fill);
  border: var(--line) solid var(--vessel-stroke);
}

/* посадочное место шкалы внутри аппарата */
.vessel .gauge {
  position: absolute;
  left: var(--gauge-x, 22%);
  top: 50%;
  transform: translateY(-50%);
}

/* ============================================================
   4. Состояния УГО ёмкости — цвет контура (Табл.11, Табл.12)
   ============================================================ */
.vessel--norm    { --vessel-stroke: var(--c-stroke);  }
.vessel--warning { --vessel-stroke: var(--c-stroke); }
.vessel--alarm   { --vessel-stroke: var(--c-stroke);   }

/* ============================================================
   5. Оформление демонстрационной страницы
   (в проект не переносится)
   ============================================================ */
body {
  margin: 0;
  padding: 40px;
  background: var(--c-mnemo-bg);
  font-family: "Segoe UI", Arial, sans-serif;
  color: #222;
}
h1 { font-size: 16px; font-weight: 600; margin: 0 0 28px; }
.demo-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 40px;
  margin-bottom: 44px;
}
.demo-item { margin: 0; }
.demo-item figcaption {
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.4;
  max-width: 160px;
}
.vessel--sm { --vessel-w: 300px; --vessel-h: 150px; --vessel-head: 70px; }
.gauge--sm  { --gauge-h: 90px; }
</style>
</head>
<body>

<h1>Шкала уровня</h1>

<div class="demo-row">
  <figure class="demo-item">
    <div class="gauge gauge--norm" style="--level: 62%">
      <div class="gauge__fill gauge__fill--liquid"></div>
      <div class="gauge__fill gauge__fill--water"></div>
    </div>
    <figcaption>Уровень</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="gauge gauge--norm" style="--level: 62%; --interface: 30%">
      <div class="gauge__fill gauge__fill--liquid"></div>
      <div class="gauge__fill gauge__fill--water"></div>
    </div>
    <figcaption>Уровень и раздел фаз, норма</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="gauge gauge--warning" style="--level: 82%; --interface: 30%">
      <div class="gauge__fill gauge__fill--liquid"></div>
      <div class="gauge__fill gauge__fill--water"></div>
    </div>
    <figcaption>Предупредительная уставка</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="gauge gauge--alarm" style="--level: 94%; --interface: 30%">
      <div class="gauge__fill gauge__fill--liquid"></div>
      <div class="gauge__fill gauge__fill--water"></div>
    </div>
    <figcaption>Аварийная уставка</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="gauge gauge--warning is-unacked" style="--level: 82%; --interface: 30%">
      <div class="gauge__fill gauge__fill--liquid"></div>
      <div class="gauge__fill gauge__fill--water"></div>
    </div>
    <figcaption>Предупреждение, не квитировано</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="gauge gauge--alarm is-unacked" style="--level: 94%; --interface: 30%">
      <div class="gauge__fill gauge__fill--liquid"></div>
      <div class="gauge__fill gauge__fill--water"></div>
    </div>
    <figcaption>Авария, не квитировано</figcaption>
  </figure>
</div>

<h1>Состояния ёмкости</h1>

<div class="demo-row">
  <figure class="demo-item">
    <div class="vessel vessel--sm vessel--norm">
      <div class="vessel__head vessel__head--left"></div>
      <div class="vessel__head vessel__head--right"></div>
      <div class="vessel__shell"></div>
      <div class="gauge gauge--sm gauge--norm" style="--level: 62%; --interface: 30%">
        <div class="gauge__fill gauge__fill--liquid"></div>
        <div class="gauge__fill gauge__fill--water"></div>
      </div>
    </div>
    <figcaption>Нормальный режим</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="vessel vessel--sm vessel--warning">
      <div class="vessel__head vessel__head--left"></div>
      <div class="vessel__head vessel__head--right"></div>
      <div class="vessel__shell"></div>
      <div class="gauge gauge--sm gauge--warning" style="--level: 82%; --interface: 30%">
        <div class="gauge__fill gauge__fill--liquid"></div>
        <div class="gauge__fill gauge__fill--water"></div>
      </div>
    </div>
    <figcaption>Предупредительная уставка</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="vessel vessel--sm vessel--alarm">
      <div class="vessel__head vessel__head--left"></div>
      <div class="vessel__head vessel__head--right"></div>
      <div class="vessel__shell"></div>
      <div class="gauge gauge--sm gauge--alarm" style="--level: 94%; --interface: 30%">
        <div class="gauge__fill gauge__fill--liquid"></div>
        <div class="gauge__fill gauge__fill--water"></div>
      </div>
    </div>
    <figcaption>Аварийная уставка</figcaption>
  </figure>
</div>

<h1>Мигание до квитирования</h1>

<div class="demo-row">
  <figure class="demo-item">
    <div class="vessel vessel--sm vessel--warning">
      <div class="vessel__head vessel__head--left"></div>
      <div class="vessel__head vessel__head--right"></div>
      <div class="vessel__shell"></div>
      <div class="gauge gauge--sm gauge--warning is-unacked" style="--level: 82%; --interface: 30%">
        <div class="gauge__fill gauge__fill--liquid"></div>
        <div class="gauge__fill gauge__fill--water"></div>
      </div>
    </div>
    <figcaption>Предупреждение, не квитировано</figcaption>
  </figure>

  <figure class="demo-item">
    <div class="vessel vessel--sm vessel--alarm">
      <div class="vessel__head vessel__head--left"></div>
      <div class="vessel__head vessel__head--right"></div>
      <div class="vessel__shell"></div>
      <div class="gauge gauge--sm gauge--alarm is-unacked" style="--level: 94%; --interface: 30%">
        <div class="gauge__fill gauge__fill--liquid"></div>
        <div class="gauge__fill gauge__fill--water"></div>
      </div>
    </div>
    <figcaption>Авария, не квитировано</figcaption>
  </figure>
</div>

</body>
</html>
