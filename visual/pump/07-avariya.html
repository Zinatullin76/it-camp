<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авария</title>
<style>
  /* УГО насосного агрегата (НА). Состояние: Авария */
  .pump { width: 210px; }
  .pump__svg { display: block; width: 100%; height: auto; }

  .pump__volute { fill: #FF0000;    stroke: #000; stroke-width: 4; }
  .pump__body   { fill: #BEBEBE;  stroke: #000; stroke-width: 4; }
  .pump__flange { fill: #BEBEBE;  stroke: #000; stroke-width: 4; }
  .pump__hub    { fill: #BEBEBE;  stroke: #000; stroke-width: 3; }
  .pump__center { fill: #FF0000; stroke: #000; stroke-width: 2; }

  .pump__volute,
  .pump__center {
    animation: pump-blink 1s steps(1, end) infinite;
  }
  @keyframes pump-blink {
    0%, 49.9% { fill: #FF0000; }
    50%, 100% { fill: #BEBEBE; }
  }
</style>
</head>
<body>
<div class="pump">
  <svg class="pump__svg" viewBox="0 0 210 130" xmlns="http://www.w3.org/2000/svg">
    <!-- напорный патрубок -->
    <rect class="pump__body"   x="96" y="18" width="77" height="34"/>
    <!-- опора агрегата -->
    <rect class="pump__volute" x="78" y="90" width="59" height="16"/>
    <!-- улитка (основной цвет НА) -->
    <circle class="pump__volute" cx="106" cy="59" r="42"/>
    <!-- опорная плита -->
    <rect class="pump__volute" x="73" y="104" width="70" height="9"/>
    <!-- всасывающий фланец и патрубок -->
    <rect class="pump__flange" x="22" y="36" width="13" height="46"/>
    <rect class="pump__body"   x="37" y="46" width="62" height="28"/>
    <!-- фланец напорного патрубка -->
    <rect class="pump__flange" x="174" y="12" width="13" height="45"/>
    <!-- корпус рабочего колеса -->
    <circle class="pump__hub" cx="106" cy="59" r="25"/>
    <!-- центральный элемент (рабочее колесо) -->
    <path class="pump__center" d="M97 46 L97 72 L121 59 Z"/>
  </svg>
</div>
</body>
</html>
