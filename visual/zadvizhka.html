<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО задвижки</title>
<style>
  :root {
    --bg:      #CCCCCC;
    --oil:     #000000;
    --contour: #000000;
    --filled:  #000000;   /* цвет закрашенной половины */
    --empty:   #FFFFFF;   /* цвет незакрашенной половины */
  }

  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
  }

  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 13px; margin-top: 4px; }

  .mnemo { width: 160px; height: 60px; display: block; }

  .pipe--oil { stroke: var(--oil); }

  .gate__tri   { stroke: var(--contour); stroke-width: 2; }
  .gate__stem  { stroke: var(--contour); }

  .gate__tri--left  { fill: var(--tri-left,  var(--empty)); }
  .gate__tri--right { fill: var(--tri-right, var(--empty)); }

  /* модификаторы: какая половина закрашена */
  .gate--none  { --tri-left: var(--empty);  --tri-right: var(--empty); }
  .gate--left  { --tri-left: var(--filled); }
  .gate--right { --tri-right: var(--filled); }
  .gate--both  { --tri-left: var(--filled); --tri-right: var(--filled); }
</style>
</head>
<body>
  <div class="grid">

    <figure class="gate--none">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="gate__tri gate__tri--left"  points="50,10 50,50 80,30"   fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <polygon class="gate__tri gate__tri--right" points="110,10 110,50 80,30" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line class="gate__stem" x1="80" y1="6" x2="80" y2="54" stroke="#000000" stroke-width="2.5"/>
      </svg>
      <figcaption>gate--none</figcaption>
    </figure>

    <figure class="gate--left">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="gate__tri gate__tri--left"  points="50,10 50,50 80,30"   fill="#000000" stroke="#000000" stroke-width="2"/>
        <polygon class="gate__tri gate__tri--right" points="110,10 110,50 80,30" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <line class="gate__stem" x1="80" y1="6" x2="80" y2="54" stroke="#000000" stroke-width="2.5"/>
      </svg>
      <figcaption>gate--left</figcaption>
    </figure>

    <figure class="gate--right">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="gate__tri gate__tri--left"  points="50,10 50,50 80,30"   fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <polygon class="gate__tri gate__tri--right" points="110,10 110,50 80,30" fill="#000000" stroke="#000000" stroke-width="2"/>
        <line class="gate__stem" x1="80" y1="6" x2="80" y2="54" stroke="#000000" stroke-width="2.5"/>
      </svg>
      <figcaption>gate--right</figcaption>
    </figure>

    <figure class="gate--both">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="gate__tri gate__tri--left"  points="50,10 50,50 80,30"   fill="#000000" stroke="#000000" stroke-width="2"/>
        <polygon class="gate__tri gate__tri--right" points="110,10 110,50 80,30" fill="#000000" stroke="#000000" stroke-width="2"/>
        <line class="gate__stem" x1="80" y1="6" x2="80" y2="54" stroke="#000000" stroke-width="2.5"/>
      </svg>
      <figcaption>gate--both</figcaption>
    </figure>

  </div>
</body>
</html>
