<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО смесителя</title>
<style>
  :root {
    --bg:      #CCCCCC;
    --normal:  #D7D7D7;
    --oil:     #000000;
    --contour: #000000;
  }

  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    font-family: Arial, Helvetica, sans-serif;
  }

  .mnemo { width: 160px; height: 130px; display: block; }

  .pipe--oil { stroke: var(--oil); }

  .mixer__body   { fill: var(--normal); stroke: var(--contour); }
  .mixer__blades { fill: none; stroke: var(--contour); }
</style>
</head>
<body>
  <svg class="mnemo" viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg">
    <line class="pipe pipe--oil" x1="0" y1="50" x2="160" y2="50" stroke="#000000" stroke-width="3"/>
    <polygon class="mixer__body" points="80,10 120,50 80,90 40,50" fill="#D7D7D7" stroke="#000000" stroke-width="2"/>
    <path class="mixer__blades" d="M 60 33 C 74 33 86 67 100 67" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path class="mixer__blades" d="M 60 67 C 74 67 86 33 100 33" fill="none" stroke="#000000" stroke-width="2.5"/>
  </svg>
</body>
</html>
