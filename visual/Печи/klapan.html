<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО клапана</title>
<style>
  :root {
    --bg:      #CCCCCC;
    --oil:     #000000;
    --contour: #000000;
    --filled:  #000000;   /* цвет закрашенного треугольника */
    --empty:   #FFFFFF;   /* цвет незакрашенного треугольника */
  }

  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
  }

  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 13px; margin-top: 4px; }

  .mnemo { width: 160px; height: 60px; display: block; }

  .pipe--oil { stroke: var(--oil); }

  .valve__tri { stroke: var(--contour); stroke-width: 2; }

  /* по умолчанию обе половины пустые */
  .valve__tri--left  { fill: var(--tri-left,  var(--empty)); }
  .valve__tri--right { fill: var(--tri-right, var(--empty)); }

  /* модификаторы: какой треугольник закрашен */
  .valve--left  { --tri-left:  var(--filled); }
  .valve--right { --tri-right: var(--filled); }
  .valve--both  { --tri-left:  var(--filled); --tri-right: var(--filled); }
  .valve--none  { --tri-left:  var(--empty);  --tri-right: var(--empty); }
</style>
</head>
<body>
  <div class="grid">

    <figure class="valve--left">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="valve__tri valve__tri--left"  points="50,10 50,50 80,30"   fill="#000000" stroke="#000000" stroke-width="2"/>
        <polygon class="valve__tri valve__tri--right" points="110,10 110,50 80,30" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      </svg>
      <figcaption>valve--left</figcaption>
    </figure>

    <figure class="valve--right">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="valve__tri valve__tri--left"  points="50,10 50,50 80,30"   fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <polygon class="valve__tri valve__tri--right" points="110,10 110,50 80,30" fill="#000000" stroke="#000000" stroke-width="2"/>
      </svg>
      <figcaption>valve--right</figcaption>
    </figure>

    <figure class="valve--both">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="valve__tri valve__tri--left"  points="50,10 50,50 80,30"   fill="#000000" stroke="#000000" stroke-width="2"/>
        <polygon class="valve__tri valve__tri--right" points="110,10 110,50 80,30" fill="#000000" stroke="#000000" stroke-width="2"/>
      </svg>
      <figcaption>valve--both</figcaption>
    </figure>

    <figure class="valve--none">
      <svg class="mnemo" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
        <line class="pipe pipe--oil" x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="3"/>
        <polygon class="valve__tri valve__tri--left"  points="50,10 50,50 80,30"   fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <polygon class="valve__tri valve__tri--right" points="110,10 110,50 80,30" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      </svg>
      <figcaption>valve--none</figcaption>
    </figure>

  </div>
</body>
</html>
