<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО К-12/4</title>
<style>
  :root{
    /* Палитра по Приказу № 251-П, Приложение №1 */
    --bg:        #CCCCCC;  /* фон мнемосхемы            */
    --norm:      #D7D7D7;  /* нормальное/статичное обор. */
    --line:      #000000;  /* контур, нефтепродукт       */
    --packing:   #FFFFFF;  /* подложка слоя катализатора */
    --lw-body:   2.4;      /* толщина контура аппарата   */
    --lw-inner:  2;        /* внутренние линии           */
  }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
  }

  .mnemo{
    display:inline-block;
    padding:24px;
  }

  /* ---- УГО колонны ---- */
  .column-k124{ display:block; }

  .column-k124 .col__nozzle{
    fill:none;
    stroke:var(--line);
    stroke-width:2.4;
    stroke-linecap:butt;
  }

  .column-k124 .col__body{
    fill:var(--norm);
    stroke:var(--line);
    stroke-width:2.4;
    stroke-linejoin:round;
  }

  .column-k124 .col__packing-bg{ fill:var(--packing); }

  .column-k124 .col__packing{ fill:url(#k124-packing); }

  .column-k124 .col__packing-edge{
    stroke:var(--line);
    stroke-width:2;
  }

  .column-k124 .col__tag{
    fill:var(--line);
    font-family:Arial, Helvetica, sans-serif;
    font-size:16px;
    text-anchor:middle;
    dominant-baseline:middle;
  }
</style>
</head>
<body>

<div class="mnemo">

  <!-- =========== УГО колонны К-12/4 (демеркаптанизация фр. 140-240 °С) =========== -->
  <svg class="column-k124" xmlns="http://www.w3.org/2000/svg"
       width="140" height="360" viewBox="0 0 140 360">
    <title>Колонна К-12/4</title>

    <defs>
      <!-- Насадка / слой катализатора: перекрёстная штриховка -->
      <pattern id="k124-packing" width="10" height="10"
               patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0"  y2="10" stroke="#000000" stroke-width="1.4"/>
        <line x1="0" y1="0" x2="10" y2="0"  stroke="#000000" stroke-width="1.4"/>
      </pattern>
    </defs>

    <!-- ---- ШТУЦЕРА (до корпуса, стенка перекрывает корни) ---- -->
    <!-- Ш1 — вход газопродуктовой смеси (фр. 140-240 °С + ВСГ) -->
    <line class="col__nozzle" x1="70" y1="10" x2="70" y2="56"
          fill="none" stroke="#000000" stroke-width="2.4"/>
    <!-- Ш2 — выход реакционной смеси в стриппинг К-12/3 -->
    <line class="col__nozzle" x1="70" y1="304" x2="70" y2="350"
          fill="none" stroke="#000000" stroke-width="2.4"/>

    <!-- ---- КОРПУС АППАРАТА ---- -->
    <path class="col__body"
          d="M 25,40
             A 45,16 0 0 1 115,40
             L 115,320
             A 45,16 0 0 1 25,320
             Z"
          fill="#D7D7D7" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- ---- СЛОЙ КАТАЛИЗАТОРА ---- -->
    <rect class="col__packing-bg" x="26.2" y="62" width="87.6" height="58" fill="#FFFFFF"/>
    <rect class="col__packing"    x="26.2" y="62" width="87.6" height="58" fill="url(#k124-packing)"/>
    <line class="col__packing-edge" x1="26.2" y1="62"  x2="113.8" y2="62"
          stroke="#000000" stroke-width="2"/>
    <line class="col__packing-edge" x1="26.2" y1="120" x2="113.8" y2="120"
          stroke="#000000" stroke-width="2"/>

    <!-- ---- ПОЗИЦИОННОЕ ОБОЗНАЧЕНИЕ ---- -->
    <text class="col__tag" x="70" y="150"
          fill="#000000" font-family="Arial, Helvetica, sans-serif"
          font-size="16" text-anchor="middle" dominant-baseline="middle">К-12/4</text>
  </svg>

</div>

</body>
</html>
