<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО колонны К-3</title>
<style>
  html,body{margin:0;padding:0;background:#CCCCCC;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}

  .mnemo{display:block;}

  /* контур аппарата */
  .vessel__shell{
    fill:none;
    stroke:#1A1A1A;
    stroke-width:2;
    stroke-linejoin:miter;
    stroke-linecap:butt;
  }
  /* штуцера (боковые врезки) */
  .vessel__nozzle{
    fill:none;
    stroke:#1A1A1A;
    stroke-width:2;
    stroke-linecap:butt;
  }
  /* штуцерные патрубки верха/низа с отводом */
  .vessel__pipe{
    fill:none;
    stroke:#1A1A1A;
    stroke-width:1.2;
    stroke-linecap:butt;
    stroke-linejoin:miter;
  }
  /* указатель подвода среды */
  .vessel__feed{
    fill:none;
    stroke:#1A1A1A;
    stroke-width:1.2;
    stroke-linejoin:miter;
  }
  /* позиционное обозначение */
  .vessel__tag{
    font-family:Arial, Helvetica, sans-serif;
    font-size:10px;
    fill:#1A1A1A;
  }
  .vessel__tag-line{
    stroke:#1A1A1A;
    stroke-width:1;
  }
</style>
</head>
<body>

<svg class="mnemo" width="150" height="850" viewBox="0 0 75 425"
     xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">

  <!-- ============ вертикальные образующие корпуса ============ -->
  <!-- левая: разрывы на пересечении с паровыми линиями К-3/2 и К-3/3 -->
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,22 L11.5,148  M11.5,155 L11.5,296  M11.5,303 L11.5,400"/>
  <!-- правая: разрывы на пересечении с линиями вывода низа К-3/1 и К-3/2 -->
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M59.5,22 L59.5,119  M59.5,125 L59.5,270  M59.5,279 L59.5,400"/>

  <!-- ==================== СЕКЦИЯ К-3/1 ==================== -->
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,22 L36,15 L59.5,22"/>
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,105 L36,113 L59.5,105"/>
  <!-- штуцер вывода паров (верх) -->
  <path class="vessel__pipe" fill="none" stroke="#1A1A1A" stroke-width="1.2"
        d="M36,15 L36,4 L0,4"/>
  <!-- штуцер ввода сырья (левый) -->
  <path class="vessel__nozzle" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,31 L0,31"/>
  <!-- указатель подвода перегретого пара -->
  <polygon class="vessel__feed" fill="none" stroke="#1A1A1A" stroke-width="1.2"
           points="1,91.5 1,101.5 12,96.5"/>
  <!-- штуцер вывода жидкости (низ) -->
  <path class="vessel__pipe" fill="none" stroke="#1A1A1A" stroke-width="1.2"
        d="M36,113 L36,122 L75,122"/>
  <text class="vessel__tag" x="15" y="56">К-3/1</text>
  <line class="vessel__tag-line" x1="15" y1="61" x2="54" y2="61" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ==================== СЕКЦИЯ К-3/2 ==================== -->
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,174 L36,166 L59.5,174"/>
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,256 L36,264 L59.5,256"/>
  <path class="vessel__pipe" fill="none" stroke="#1A1A1A" stroke-width="1.2"
        d="M36,166 L36,151.5 L0,151.5"/>
  <path class="vessel__nozzle" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,188 L0,188"/>
  <path class="vessel__pipe" fill="none" stroke="#1A1A1A" stroke-width="1.2"
        d="M36,264 L36,273 L75,273"/>
  <text class="vessel__tag" x="15" y="208">К-3/2</text>
  <line class="vessel__tag-line" x1="15" y1="213" x2="54" y2="213" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ==================== СЕКЦИЯ К-3/3 ==================== -->
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,317 L36,310 L59.5,317"/>
  <path class="vessel__shell" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,400 L36,408 L59.5,400"/>
  <path class="vessel__pipe" fill="none" stroke="#1A1A1A" stroke-width="1.2"
        d="M36,310 L36,299.5 L0,299.5"/>
  <path class="vessel__nozzle" fill="none" stroke="#1A1A1A" stroke-width="2"
        d="M11.5,336 L0,336"/>
  <path class="vessel__pipe" fill="none" stroke="#1A1A1A" stroke-width="1.2"
        d="M36,408 L36,417 L75,417"/>
  <text class="vessel__tag" x="15" y="358">К-3/3</text>
  <line class="vessel__tag-line" x1="15" y1="363" x2="54" y2="363" stroke="#1A1A1A" stroke-width="1"/>

</svg>

</body>
</html>
