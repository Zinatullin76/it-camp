<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО К-12/2 + К-12/3 — АВТ-4</title>
<style>
  :root{
    --bg:     #CCCCCC;  /* фон мнемосхемы          */
    --normal: #D7D7D7;  /* оборудование, норма     */
    --line:   #000000;  /* контур оборудования     */
  }
  html,body{margin:0;padding:0;background:var(--bg);
            font-family:Arial, Helvetica, sans-serif;color:#000;}
  .wrap{padding:24px;}
  .mnemo{display:block;}
  .mnemo #K12-shell{fill:var(--normal);stroke:var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <svg class="mnemo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 131 414"
       width="393" height="1242" role="img" aria-label="УГО К-12/2 и К-12/3">
<defs>
    <!-- Слой катализатора -->
    <pattern id="k12-catalyst" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#D7D7D7"/>
      <path d="M-2,2 L2,-2 M0,7 L7,0 M5,9 L9,5" stroke="#000000" stroke-width="1" fill="none"/>
      <path d="M-2,5 L2,9 M0,0 L7,7 M5,-2 L9,2" stroke="#000000" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <!-- ================= ФОН МНЕМОСХЕМЫ ================= -->
  

  <!-- ================= ШТУЦЕРА И ПОДВОДЫ (рисуются до корпуса) ================= -->
  <g stroke="#000000" stroke-width="1.6" fill="none" stroke-linecap="square">
    <!-- А  вход газосырьевой смеси (фр.140-240 + ВСГ) в К-12/2 -->
    <path d="M59.5,8 L59.5,53"/>
    <!-- В  выход продуктов реакции из К-12/2 в К-12/3 (самотёком) -->
    <path d="M59.5,177 L59.5,188.5 L13,188.5"/>
    <!-- И  выход паров УВ и ВСГ с верха К-12/3 -->
    <path d="M59.5,237 L59.5,210.5 L129,210.5"/>
    <!-- Л  вход абсорбента фр.140-240 в К-12/3 -->
    <path d="M94,265.5 L113.5,265.5"/>
    <!-- М  вход перегретого пара в К-12/3 -->
    <path d="M0,363.5 L23,363.5"/>
    <!-- Н  выход фр.140-240 из куба К-12/3 -->
    <path d="M59.5,382 L59.5,394.5 L79,394.5"/>
  </g>

  <!-- Направления потоков -->
  <path d="M0.5,188.5 L13.5,181 L13.5,196 Z" fill="#000000" stroke="none"/>
  <path d="M113.5,258 L126,265.5 L113.5,273 Z" fill="none" stroke="#000000" stroke-width="1.6"/>
  <path d="M14.5,357 L23.5,363.5 L14.5,370" fill="none" stroke="#000000" stroke-width="1.6"/>

  <!-- ================= КОРПУС ================= -->
  <!-- Общая обечайка: крышка К-12/2 сверху, днище К-12/3 снизу -->
  <path id="K12-shell"
        d="M26,47 L59.5,37.5 L94,47 L94,372 L59.5,382 L26,372 Z"
        fill="#D7D7D7" stroke="#000000" stroke-width="2.4" stroke-linejoin="miter"/>

  <!-- ================= К-12/2 ================= -->
  <g id="K12-2">
    <!-- Ороситель газосырьевой смеси -->
    <g stroke="#000000" stroke-width="1.4" fill="none">
      <path d="M35,52.5 L85,52.5"/>
      <path d="M36.5,53 L32.5,57.5 M36.5,53 L40.5,57.5"/>
      <path d="M52.5,53 L48.5,57.5 M52.5,53 L56.5,57.5"/>
      <path d="M68.5,53 L64.5,57.5 M68.5,53 L72.5,57.5"/>
      <path d="M84.5,53 L80.5,57.5 M84.5,53 L88.5,57.5"/>
    </g>

    <!-- Слой катализатора между опорной и прижимной решётками -->
    <rect x="26" y="86.5" width="68" height="35" fill="url(#k12-catalyst)" stroke="none"/>
    <path d="M26,86.5 L94,86.5 M26,121.5 L94,121.5"
          stroke="#000000" stroke-width="2.4" fill="none"/>

    <!-- Днище К-12/2 -->
    <path d="M26,167 L59.5,177 L94,167" fill="none" stroke="#000000" stroke-width="2.4"/>

    <text x="59.5" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="17" fill="#000000">К12/2</text>
  </g>

  <!-- ================= К-12/3 ================= -->
  <g id="K12-3">
    <!-- Крышка К-12/3 -->
    <path d="M26,246 L59.5,237 L94,246" fill="none" stroke="#000000" stroke-width="2.4"/>

    <text x="59" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="16" fill="#000000">К12/3</text>

    <!-- Ороситель абсорбента -->
    <g stroke="#000000" stroke-width="1.4" fill="none">
      <path d="M36,265.5 L94,265.5"/>
      <path d="M36.5,266 L32.5,270.5 M36.5,266 L40.5,270.5"/>
      <path d="M52.5,266 L48.5,270.5 M52.5,266 L56.5,270.5"/>
      <path d="M68.5,266 L64.5,270.5 M68.5,266 L72.5,270.5"/>
      <path d="M84.5,266 L80.5,270.5 M84.5,266 L88.5,270.5"/>
    </g>

    <!-- Тарелки 4 - 1 -->
    <g stroke="#000000" stroke-width="1.8" fill="none">
      <path d="M26,298.5 L94,298.5"/>
      <path d="M26,311.5 L94,311.5"/>
      <path d="M26,324.5 L94,324.5"/>
      <path d="M26,337.5 L94,337.5"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#000000" text-anchor="middle">
      <rect x="61" y="292.5" width="23" height="10" fill="#D7D7D7" stroke="none"/>
      <text x="72.5" y="301">4 тар</text>
      <rect x="61" y="305.5" width="23" height="10" fill="#D7D7D7" stroke="none"/>
      <text x="72.5" y="314">3 тар</text>
      <rect x="61" y="318.5" width="23" height="10" fill="#D7D7D7" stroke="none"/>
      <text x="72.5" y="327">2 тар</text>
      <rect x="61" y="331.5" width="23" height="10" fill="#D7D7D7" stroke="none"/>
      <text x="72.5" y="340">1 тар</text>
    </g>

    <!-- Маточник перегретого пара -->
    <g stroke="#000000" stroke-width="1.4" fill="none">
      <path d="M38.5,349.5 L81,349.5"/>
      <path d="M34.5,345 L38.5,349.5 M42.5,345 L38.5,349.5"/>
      <path d="M55.5,345 L59.5,349.5 M63.5,345 L59.5,349.5"/>
      <path d="M76,345 L80,349.5 M84,345 L80,349.5"/>
      <path d="M38.5,350 L38.5,363.5 L23,363.5"/>
    </g>
  </g>

  <!-- ================= ОБОЗНАЧЕНИЯ ШТУЦЕРОВ ================= -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#000000">
    <text x="62.5" y="14">А</text>
    <text x="16" y="185">В</text>
    <text x="100" y="207">И</text>
    <text x="100" y="262">Л</text>
    <text x="4" y="360">М</text>
    <text x="82" y="391">Н</text>
  </g>

  </svg>
</div>
</body>
</html>
