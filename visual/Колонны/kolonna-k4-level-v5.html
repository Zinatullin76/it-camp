<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО колонна К-4</title>
<style>
  html,body{margin:0;padding:0;background:#CCCCCC;}
  .wrap{padding:24px;}

  /* ================= КОЛОННА ================= */
  .col{
    --body-fill:#E6E6E6;   /* заливка корпуса аппарата */
    --line:#000000;        /* контур и внутренние линии */
    --text:#000000;        /* надписи */
    --level:#000000;       /* среда в кубе: нефтепродукт */

    /* уровень в кубе, % шкалы LRCA (0…100) */
    --lvl:55;
  }

  .col__body{
    fill:var(--body-fill,#E6E6E6);
    stroke:var(--line,#000000);
    stroke-width:2.5;
    stroke-linejoin:miter;
  }
  .col__tray  { stroke:var(--line,#000000); stroke-width:2; fill:none; }
  .col__nozzle,
  .col__pipe  { stroke:var(--line,#000000); stroke-width:2.5; fill:none; }
  .col__txt   { fill:var(--text,#000000); font-family:Arial,Helvetica,sans-serif; font-size:15px; }
  .col__tag   { fill:var(--text,#000000); font-family:Arial,Helvetica,sans-serif; font-size:30px; letter-spacing:1px; }

  /* Уровень: прямоугольник полной высоты шкалы (y=620…750),
     сжимается по вертикали от нижней точки. --lvl = 0…100 % */
  .col__level{
    fill:var(--level,#000000);
    transform-box:view-box;
    transform-origin:125px 750px;     /* низ шкалы */
    transform:scaleY(calc(var(--lvl,55) / 100));
  }
</style>
</head>
<body>
<div class="wrap">

<svg class="col" width="340" height="800" viewBox="0 0 340 800" xmlns="http://www.w3.org/2000/svg">

  <!-- ==================== ШТУЦЕР ПАРОВ С ВЕРХА ==================== -->
  <line class="col__pipe" x1="104.30142" y1="160" x2="104.30142" y2="118"
        stroke="#000000" stroke-width="2.5" fill="none"/>

  <!-- ==================== ШТУЦЕРА ==================== -->
  <line class="col__nozzle" x1="70"  y1="265" x2="34"  y2="265" stroke="#000" stroke-width="2.5" fill="none"/>
  <line class="col__nozzle" x1="70"  y1="385" x2="34"  y2="385" stroke="#000" stroke-width="2.5" fill="none"/>
  <line class="col__nozzle" x1="70"  y1="505" x2="34"  y2="505" stroke="#000" stroke-width="2.5" fill="none"/>
  <line class="col__nozzle" x1="180" y1="655" x2="222" y2="655" stroke="#000" stroke-width="2.5" fill="none"/>
  <!-- два выхода с низа колонны -->
  <line class="col__nozzle" x1="111" y1="750" x2="111" y2="786" stroke="#000" stroke-width="2.5" fill="none"/>
  <line class="col__nozzle" x1="139" y1="750" x2="139" y2="786" stroke="#000" stroke-width="2.5" fill="none"/>

  <!-- ==================== КОРПУС КОЛОННЫ ==================== -->
  <path class="col__body"
        d="M 70 200 L 98 160 L 152 160 L 180 200 L 180 700 L 152 750 L 98 750 L 70 700 Z"
        fill="#E6E6E6" stroke="#000" stroke-width="2.5"/>

  <!-- ==================== УРОВЕНЬ В КУБЕ ==================== -->
  <clipPath id="k4-clip">
    <path d="M 70 200 L 98 160 L 152 160 L 180 200 L 180 700 L 152 750 L 98 750 L 70 700 Z"/>
  </clipPath>
  <g clip-path="url(#k4-clip)">
    <!-- шкала уровня: 0 % → y=750, 100 % → y=620 -->
    <rect class="col__level" x="65" y="620" width="120" height="130" fill="#000000"/>
  </g>

  <!-- контур поверх заливки -->
  <path class="col__body"
        d="M 70 200 L 98 160 L 152 160 L 180 200 L 180 700 L 152 750 L 98 750 L 70 700 Z"
        fill="none" stroke="#000" stroke-width="2.5"/>

  <!-- ==================== ТАРЕЛКИ ==================== -->
  <line class="col__tray" x1="70" y1="265" x2="180" y2="265" stroke="#000" stroke-width="2" fill="none"/>
  <text class="col__txt" x="76" y="259" fill="#000">34 тар.</text>

  <line class="col__tray" x1="70" y1="385" x2="180" y2="385" stroke="#000" stroke-width="2" fill="none"/>
  <text class="col__txt" x="76" y="379" fill="#000">23 тар.</text>

  <line class="col__tray" x1="70" y1="505" x2="180" y2="505" stroke="#000" stroke-width="2" fill="none"/>
  <text class="col__txt" x="76" y="499" fill="#000">15 тар.</text>

  <!-- ==================== ПОЗИЦИЯ ==================== -->
  <text class="col__tag" x="125" y="452" text-anchor="middle" fill="#000">К-4</text>

  <!-- ==================== ППК СО СБРОСОМ В АТМОСФЕРУ ==================== -->
  <!-- ППК № 2: сброс газа в каплеотбойник Е-44К (заводской факел) -->
  <line class="col__nozzle" x1="180" y1="240" x2="200" y2="240" stroke="#000" stroke-width="2.5" fill="none"/>
  <g class="pk" transform="translate(167.786,152.892) scale(0.413)">
    <path class="pk__pipe"   fill="none" stroke="#000000" stroke-width="2.5"
          d="M 78,211 V 160"/>
    <path class="pk__pipe"   fill="none" stroke="#000000" stroke-width="2.5"
          d="m 124,128 h 64"/>
    <path class="pk__body"   fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
          d="M 78,128 58,162 H 98 Z"/>
    <path class="pk__body"   fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
          d="m 78,128 46,-22 v 44 z"/>
    <path class="pk__spring" fill="none" stroke="#000000" stroke-width="2"
          d="M 78,128 60,118 72,112 58,104"/>
  </g>

  <!-- ППК № 1: сброс в атмосферу -->
  <g class="pk" transform="translate(105.87596,75.706001) scale(0.413)">
    <path class="pk__pipe"   fill="none" stroke="#000000" stroke-width="2.5"
          d="M 78,211 V 160"/>
    <path class="pk__pipe"   fill="none" stroke="#000000" stroke-width="2.5"
          d="M 148,128 V 46 a 22,22 0 0 0 -44,0 v 36"/>
    <path class="pk__pipe"   fill="none" stroke="#000000" stroke-width="2.5"
          d="m 124,128 h 24"/>
    <path class="pk__body"   fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
          d="M 78,128 58,162 H 98 Z"/>
    <path class="pk__body"   fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
          d="m 78,128 46,-22 v 44 z"/>
    <path class="pk__spring" fill="none" stroke="#000000" stroke-width="2"
          d="M 78,128 60,118 72,112 58,104"/>
  </g>

</svg>

<!-- ППК: стили вынесены сюда, чтобы не смешивались с переменными .col -->
<style>
  .pk{ --pk-body:#D7D7D7; --pk-line:#000000; }
  .pk__body  { fill:var(--pk-body,#D7D7D7); stroke:var(--pk-line,#000000); stroke-width:2.5;
               stroke-linejoin:miter; vector-effect:non-scaling-stroke; }
  .pk__pipe  { fill:none; stroke:var(--pk-line,#000000); stroke-width:2.5;
               stroke-linecap:butt; vector-effect:non-scaling-stroke; }
  .pk__spring{ fill:none; stroke:var(--pk-line,#000000); stroke-width:2;
               stroke-linejoin:miter; vector-effect:non-scaling-stroke; }
</style>

</div>
</body>
</html>
