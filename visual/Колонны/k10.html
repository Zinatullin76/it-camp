<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>УГО К-10 — колонна вторичной перегонки бензина (АВТ-4)</title>
<style>
  /* ================================================================
     Приказ № 251-П от 17.06.2026, Приложение №1
     Цветовая палитра мнемосхем
     ================================================================ */
  :root {
    --bg:      #CCCCCC;  /* фон мнемосхемы                    */
    --line:    #000000;  /* контур оборудования / нефтепродукт */
    --normal:  #D7D7D7;  /* состояние «Нормальное»            */
    --warn:    #FFFF00;  /* состояние «Предупреждение»        */
    --alarm:   #FF0000;  /* состояние «Авария»                */
    --fault:   #FFAA00;  /* состояние «Отказ»                 */
    --sim:     #00FFFF;  /* состояние «Имитация»              */
    --repair:  #AA5500;  /* состояние «Ремонт»                */
    --oil:     #000000;  /* нефть и нефтепродукты             */
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    color: var(--line);
  }

  .page {
    padding: 24px;
  }

  /* ================================================================
     УГО колонны К-10
     Переменные состояния объявляются на контейнере .state-*,
     а не на самом правиле .k10 — иначе каскад не даст разместить
     несколько состояний на одной странице.
     ================================================================ */
  .k10 {
    --k10-level: 0.55;              /* уровень куба, 0.00 … 1.00 */
    --k10-fill:  var(--oil);        /* цвет заливки уровня       */
    --k10-blink: none;              /* анимация мигания          */
    display: block;
  }

  .state-norm   { --k10-fill: var(--oil);    }
  .state-warn   { --k10-fill: var(--warn);   }
  .state-alarm  { --k10-fill: var(--alarm);  }
  .state-fault  { --k10-fill: var(--fault);  }
  .state-sim    { --k10-fill: var(--sim);    }
  .state-repair { --k10-fill: var(--repair); }

  /* неквитированная сигнализация — мигание 1 Гц, без плавных переходов */
  .state-warn-unack  { --k10-fill: var(--warn);  --k10-blink: k10-blink 1s steps(1, end) infinite; }
  .state-alarm-unack { --k10-fill: var(--alarm); --k10-blink: k10-blink 1s steps(1, end) infinite; }

  @keyframes k10-blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ---- элементы ---- */
  .k10__body   { fill: var(--normal); stroke: var(--line); stroke-width: 2;
                 stroke-linejoin: round; }

  .k10__shell  { fill: none; stroke: var(--line); stroke-width: 2;
                 stroke-linejoin: round; }

  .k10__nozzle { fill: none; stroke: var(--line); stroke-width: 2;
                 stroke-linecap: butt; }

  .k10__tray   { fill: none; stroke: var(--line); stroke-width: 1.5; }

  .k10__level  { fill: var(--k10-fill); stroke: none;
                 transform: scaleY(var(--k10-level));
                 transform-origin: 150px 722px;
                 transform-box: view-box;
                 animation: var(--k10-blink); }

  /* ---- ППК ---- */
  .pk__pipe    { fill: none; stroke: var(--line); stroke-width: 2.5;
                 stroke-linecap: butt; }
  .pk__body    { fill: var(--normal); stroke: var(--line); stroke-width: 2.5;
                 stroke-linejoin: miter; }
  .pk__spring  { fill: none; stroke: var(--line); stroke-width: 2;
                 stroke-linejoin: miter; }

  /* ---- надписи ---- */
  .k10__tag    { fill: var(--line); stroke: none; font-size: 20px;
                 text-anchor: middle; }
  .k10__txt    { fill: var(--line); stroke: none; font-size: 13px;
                 dominant-baseline: hanging; }

</style>
</head>
<body>

<div class="page">

  <!-- ============================================================
       УГО К-10
       viewBox 0 0 300 800
       ============================================================ -->
  <div id="k10-host" class="state-norm">
  <svg class="k10" id="k10" viewBox="0 0 300 800" width="300" height="800"
       xmlns="http://www.w3.org/2000/svg">
    <title>К-10 — колонна вторичной перегонки бензина (фр. 62-105 / 105-180 °С)</title>

    <defs>
      <!-- контур корпуса для отсечения заливки уровня -->
      <clipPath id="k10-clip">
        <path d="M100,120 L130,88 L170,88 L200,120 L200,690 L170,722 L130,722 L100,690 Z"/>
      </clipPath>
    </defs>

    <!-- ========== ШТУЦЕРА (рисуются ДО корпуса) ========== -->
    <g class="k10__nozzles">
      <!-- Выход паров фр. 62-105 °С с верха К-10 -> Х-22, Х-21/2, АВЗ-1, АВЗ-2 -> Е-17 -->
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M151.71,88.90 V5.90"/>

      <!-- Острое орошение фр. 62-105 °С от Н-55 (Н-56, Н-59) -->
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M240.12,164.72 H199.55"/>

      <!-- Загрузка фр. 62-180 °С с низа К-9 (Н-76 / Н-79) -->
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M100.23,267.47 H59.66"/>
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M100.33,296.18 H59.78"/>
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M99.59,352.95 H59.03"/>
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M99.80,384.35 H59.24"/>

      <!-- Возврат горячей струи из П-4 (2-й, левый поток) -->
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M100.89,570.60 H60.34"/>

      <!-- Низ: фр. 105-180 °С на Н-58 (Н-58А) и кубовый продукт на Н-77 (Н-77А) -->
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M133.89,761.66 V721.08"/>
      <path class="k10__nozzle" fill="none" stroke="#000000" stroke-width="2"
            d="M165.68,762.10 V721.53"/>
    </g>

    <!-- ========== КОРПУС ========== -->
    <path class="k10__body" fill="#D7D7D7" stroke="#000000" stroke-width="2"
          d="M100,120 L130,88 L170,88 L200,120 L200,690 L170,722 L130,722 L100,690 Z"/>

    <!-- ========== УРОВЕНЬ В КУБЕ ========== -->
    <g clip-path="url(#k10-clip)">
      <rect class="k10__level" x="100" y="622" width="100" height="100"
            fill="#000000" stroke="none"/>
    </g>

    <!-- контур поверх заливки уровня -->
    <path class="k10__shell" fill="none" stroke="#000000" stroke-width="2"
          d="M100,120 L130,88 L170,88 L200,120 L200,690 L170,722 L130,722 L100,690 Z"/>

    <!-- ========== ТАРЕЛКИ ========== -->
    <g class="k10__trays">
      <!-- распределитель острого орошения -->
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,155 L200,155"/>
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,250 L200,250"/>
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,278 L200,278"/>
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,306 L200,306"/>
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,334 L200,334"/>
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,362 L200,362"/>
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,390 L200,390"/>
      <path class="k10__tray" fill="none" stroke="#000000" stroke-width="1.5" d="M100,580 L200,580"/>
    </g>

    <!-- ========== НАДПИСИ ========== -->
    <text class="k10__tag" x="150" y="215" fill="#000000" font-size="20"
          text-anchor="middle" font-family="Arial, Helvetica, sans-serif">К-10</text>

    <g class="k10__labels" font-family="Arial, Helvetica, sans-serif">
      <text class="k10__txt" x="105" y="253" fill="#000000" font-size="13">37 тар.</text>
      <text class="k10__txt" x="105" y="281" fill="#000000" font-size="13">35 тар.</text>
      <text class="k10__txt" x="105" y="309" fill="#000000" font-size="13">31 тар.</text>
      <text class="k10__txt" x="105" y="337" fill="#000000" font-size="13">28 тар.</text>
      <text class="k10__txt" x="105" y="365" fill="#000000" font-size="13">25 тар.</text>
      <text class="k10__txt" x="105" y="393" fill="#000000" font-size="13">17 тар.</text>
      <text class="k10__txt" x="105" y="583" fill="#000000" font-size="13">10 тар.</text>
    </g>

    <!-- ========== ППК №2 (левый, зеркальный) ========== -->
    <g transform="matrix(-0.39641331,0,0,0.38988496,164.17017,5.4101056)">
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="M 78,211 V 160"/>
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="m 124,128 h 24"/>
      <path class="pk__body" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
            d="M 78,128 58,162 H 98 Z"/>
      <path class="pk__body" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
            d="m 78,128 46,-22 v 44 z"/>
      <path class="pk__spring" fill="none" stroke="#000000" stroke-width="2"
            d="M 78,128 60,118 72,112 58,104"/>
    </g>

    <!-- ========== ППК №1 (правый, со сбросом на свечу) ========== -->
    <g transform="matrix(0.39641331,0,0,0.38988496,137.86265,5.1563758)">
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="M 78,211 V 160"/>
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="M 148,128 V 46 a 22,22 0 0 0 -44,0 v 36"/>
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="m 124,128 h 24"/>
      <path class="pk__body" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
            d="M 78,128 58,162 H 98 Z"/>
      <path class="pk__body" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
            d="m 78,128 46,-22 v 44 z"/>
      <path class="pk__spring" fill="none" stroke="#000000" stroke-width="2"
            d="M 78,128 60,118 72,112 58,104"/>
    </g>

  </svg>
  </div>

</div>

</body>
</html>
