<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>УГО К-2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #CCCCCC;               /* фон мнемосхемы, Приказ № 251-П, Табл. 11 */
  }

  .mnemo-field {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ---------------------------------------------------------------
     Уровень в кубовой части (LRCA 604 / LRSA 604А).
     --level-y — координата зеркала жидкости в системе viewBox:
        852px — уровень 0 %   (нижнее днище)
        700px — уровень 100 %
     Пересчёт из процентов: y = 852 - 1.52 * L
     --------------------------------------------------------------- */
  .column { --level-y: 776px; }

  .col__liquid {
    fill: var(--liquid, #8B5E3C);
    y: var(--level-y, 776px);
    height: 220px;
  }

  .column { width: 220px; height: 900px; display: block; }

  .col__body    { fill: #D7D7D7; stroke: #000000; stroke-width: 2.5; stroke-linejoin: miter; }
  .col__outline { fill: none;    stroke: #000000; stroke-width: 2.5; stroke-linejoin: miter; }

  .col__tray        { stroke: #000000; stroke-width: 1.5; fill: none; }
  .col__tray--blind { stroke-width: 3; }

  .col__nozzle  { fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: butt; }
  .col__nflange { stroke: #000000; stroke-width: 3; stroke-linecap: butt; }

  .col__label { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #000000; }
  .col__tag   { font-family: Arial, Helvetica, sans-serif; font-size: 26px; fill: #000000; text-anchor: middle; }

  .pk__body   { fill: #D7D7D7; stroke: #000000; stroke-width: 2.5; stroke-linejoin: miter; }
  .pk__pipe   { fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: butt; }
  .pk__spring { fill: none; stroke: #000000; stroke-width: 2; stroke-linejoin: miter; }
</style>
</head>
<body>

<div class="mnemo-field">

  <svg class="column" viewBox="0 0 220 900" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <clipPath id="k2-clip">
        <path d="M 82 46 L 138 46 L 160 90 L 160 808 L 138 852 L 82 852 L 60 808 L 60 90 Z"/>
      </clipPath>
    </defs>

    <!-- ===== Штуцера ===== -->
    <g class="col__nozzle" fill="none" stroke="#000000" stroke-width="2.5">
      <!-- левая сторона -->
      <path d="M 60 153 H 44"/>   <!-- ввод  1 ц.о. на 36 тар. (Н-12)       -->
      <path d="M 60 199 H 44"/>   <!-- отбор 1 ц.о. с 34 тар. (Н-12)        -->
      <path d="M 60 377 H 44"/>   <!-- отбор 2 ц.о. с 26 тар. (Н-13, Н-11)  -->
      <path d="M 60 421 H 44"/>   <!-- ввод  2 ц.о. на 24 тар. (Н-13, Н-11) -->
      <path d="M 60 606 H 44"/>   <!-- ввод  3 ц.о. на 14 тар. (Н-17, Н-19) -->
      <path d="M 60 650 H 44"/>   <!-- отбор 3 ц.о. с 12 тар. (Н-17, Н-19)  -->
      <path d="M 60 785 H 44"/>   <!-- ввод отбензиненной нефти (П-1,2,3)   -->
      <path d="M 60 805 H 44"/>   <!-- ввод перегретого пара, FRC 421       -->
      <!-- правая сторона -->
      <path d="M 160 115 H 176"/> <!-- острое орошение, FRC 418 (Н-7, Н-7А) -->
      <path d="M 160 153 H 176"/> <!-- ввод паров из К-3/1 на 36 тар.       -->
      <path d="M 160 176 H 176"/> <!-- фр.140-240 °С с 35 тар. в К-3/1      -->
      <path d="M 160 377 H 176"/> <!-- ввод паров из К-3/2 на 26 тар.       -->
      <path d="M 160 398 H 176"/> <!-- фр.240-300 °С с 25 тар. в К-3/2      -->
      <path d="M 160 561 H 176"/> <!-- ввод паров из К-3/3 на 16 тар.       -->
      <path d="M 160 585 H 176"/> <!-- фр.300-350 °С с 15 тар. в К-3/3      -->
      <!-- днища -->
      <path d="M 95 46 V 28"/>    <!-- пары верха К-2 на АВЗ-4,5            -->
      <path d="M 110 852 V 872"/> <!-- мазут на Н-4 (Н-4А), Н-32 (Н-32А)    -->
    </g>

    <g class="col__nflange" stroke="#000000" stroke-width="3">
      <line x1="44"  y1="147" x2="44"  y2="159"/>
      <line x1="44"  y1="193" x2="44"  y2="205"/>
      <line x1="44"  y1="371" x2="44"  y2="383"/>

      <line x1="44"  y1="799" x2="44"  y2="811"/>
      <line x1="176" y1="109" x2="176" y2="121"/>
      <line x1="176" y1="147" x2="176" y2="159"/>
      <line x1="176" y1="170" x2="176" y2="182"/>
      <line x1="176" y1="371" x2="176" y2="383"/>
      <line x1="176" y1="392" x2="176" y2="404"/>
      <line x1="176" y1="555" x2="176" y2="567"/>
      <line x1="176" y1="579" x2="176" y2="591"/>
      <line x1="89"  y1="28"  x2="101" y2="28"/>
      <line x1="104" y1="872" x2="116" y2="872"/>
    </g>

    <!-- ===== Корпус (заливка) ===== -->
    <path class="col__body"
          d="M 82 46 L 138 46 L 160 90 L 160 808 L 138 852 L 82 852 L 60 808 L 60 90 Z"
          fill="#D7D7D7" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter"/>

    <!-- ===== Уровень жидкости в кубе ===== -->
    <g clip-path="url(#k2-clip)">
      <rect class="col__liquid" x="55" y="776" width="110" height="220" fill="#8B5E3C"/>
    </g>

    <!-- ===== Контур корпуса поверх уровня ===== -->
    <path class="col__outline"
          d="M 82 46 L 138 46 L 160 90 L 160 808 L 138 852 L 82 852 L 60 808 L 60 90 Z"
          fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter"/>

    <!-- ===== Тарелки ===== -->
    <g class="col__tray" stroke="#000000" stroke-width="1.5" fill="none">
      <line x1="60" y1="130" x2="160" y2="130"/>
      <line x1="60" y1="153" x2="160" y2="153"/>
      <line x1="60" y1="176" x2="160" y2="176"/>

      <line x1="60" y1="243" x2="160" y2="243"/>
      <line x1="60" y1="377" x2="160" y2="377"/>
      <line x1="60" y1="398" x2="160" y2="398"/>
      <line x1="60" y1="421" x2="160" y2="421"/>
      <line x1="60" y1="444" x2="160" y2="444"/>
      <line x1="60" y1="466" x2="160" y2="466"/>
      <line x1="60" y1="561" x2="160" y2="561"/>
      <line x1="60" y1="585" x2="160" y2="585"/>
      <line x1="60" y1="606" x2="160" y2="606"/>
      <line x1="60" y1="628" x2="160" y2="628"/>
      <line x1="60" y1="650" x2="160" y2="650"/>
      <line x1="60" y1="765" x2="160" y2="765"/>
    </g>

    <!-- ===== Подписи тарелок ===== -->
    <g class="col__label" font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="68" y="126">43 тар.</text>
      <text x="68" y="149">36 тар.</text>
      <text x="68" y="172">35 тар.</text>
      <text x="68" y="195">34 тар.</text>
      <text x="68" y="217">33 тар.</text>
      <text x="68" y="239">32 тар.</text>
      <text x="68" y="373">26 тар.</text>
      <text x="68" y="394">25 тар.</text>
      <text x="68" y="417">24 тар.</text>
      <text x="68" y="440">23 тар.</text>
      <text x="68" y="462">22 тар.</text>
      <text x="68" y="557">16 тар.</text>
      <text x="68" y="581">15 тар.</text>
      <text x="68" y="602">14 тар.</text>
      <text x="68" y="624">13 тар.</text>
      <text x="68" y="646">12 тар.</text>
      <text x="68" y="761">6 тар.</text>
    </g>

    <!-- ===== Позиционное обозначение ===== -->
    <text class="col__tag" x="110" y="320"
          font-family="Arial, sans-serif" font-size="26" fill="#000000" text-anchor="middle">К-2</text>

    <!-- ===== Предохранительный клапан на верхнем днище ===== -->
    <g transform="matrix(0.62708493,0,0,0.59741816,-104.83553,42.223115)">
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="M 376.20854,8.5242023 V -12.773981"/>
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="m 404.36672,-26.137545 v -34.244131 a 8.8497151,9.1874499 0 0 0 -17.69943,0 v 15.034009"/>
      <path class="pk__pipe" fill="none" stroke="#000000" stroke-width="2.5"
            d="m 394.71249,-26.137545 h 9.65423"/>
      <path class="pk__body" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
            d="m 376.20854,-26.137545 -8.0452,14.198787 h 16.09039 z"/>
      <path class="pk__body" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"
            d="m 376.20854,-26.137545 18.50395,-9.18745 v 18.3749 z"/>
      <path class="pk__spring" fill="none" stroke="#000000" stroke-width="2"
            d="m 376.20854,-26.137545 -7.24068,-4.176113 4.82712,-2.505668 -5.63164,-3.340891"/>
    </g>

  </svg>

</div>

</body>
</html>
