<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>УГО К-9 — колонна вторичной перегонки бензина (АВТ-4)</title>
<style>
/* ============================================================
   УГО колонны К-9. Палитра по Приказу № 251-П, Приложение №1
   ============================================================ */

body {
  margin: 0;
  padding: 24px;
  background: #CCCCCC;
  font-family: Arial, "Liberation Sans", sans-serif;
  color: #000000;
}

.mnemo {
  --body:   #D7D7D7;   /* нормальный цвет оборудования */
  --line:   #000000;   /* линии, штуцера, обводка      */
  --oil:    #000000;   /* нефтепродукт                 */
  --water:  #5B9BD4;
  --open:   #00AF50;
  --warn:   #FFFF00;
  --closed: #BEBEBE;
  --alarm:  #FF0000;

  --shell:  var(--line);  /* обводка корпуса          */
  --liq:    var(--oil);   /* среда в кубе             */
  --level:  0.55;         /* уровень LRCA 632: 0 … 1  */

  width: 760px;
}

.k9 { display: block; width: 100%; height: auto; }

/* ---------- корпус ---------- */
.k9__shell { fill: var(--body); stroke: var(--shell); stroke-width: 3; stroke-linejoin: miter; }

/* ---------- уровень в кубе (LRCA 632) ----------
   Прямоугольник задан на полную рабочую зону 620…800,
   реальная высота — scaleY от --level с базой по низу. */
.k9__level { fill: var(--liq);
             transform-box: fill-box;
             transform-origin: bottom;
             transform: scaleY(var(--level)); }

/* ---------- линии и арматура ---------- */
.k9__nozzle { fill: none; stroke: var(--line); stroke-width: 4;     stroke-linecap: butt; }
.k9__riser  { fill: none; stroke: var(--line); stroke-width: 5.108; stroke-linecap: butt; }
.k9__stub   { fill: none; stroke: var(--line); stroke-width: 2.988; stroke-linecap: butt; }
.k9__vapour { fill: none; stroke: var(--line); stroke-width: 2.389; stroke-linecap: butt; }
.k9__tray   { fill: none; stroke: var(--line); stroke-width: 1.4; }
.k9__arrow  { fill: var(--line); stroke: none; }

.pk__body   { fill: var(--body); stroke: var(--line); stroke-width: 2.5; stroke-linejoin: miter; }
.pk__pipe   { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-linecap: butt; }
.pk__spring { fill: none; stroke: var(--line); stroke-width: 2;   stroke-linejoin: miter; }

/* ---------- текст ---------- */
.k9__tag  { fill: var(--line); stroke: none; font-size: 42px; letter-spacing: 2px; }
.k9__tr   { fill: var(--line); stroke: none; font-size: 16px; }
.k9__io   { fill: var(--line); stroke: none; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
.k9__lbl  { fill: var(--line); stroke: none; font-size: 13px; }
.k9__lbli { fill: var(--line); stroke: none; font-size: 12px; font-style: italic; }
</style>
</head>
<body>

<div class="mnemo">
<svg class="k9" viewBox="0 0 760 960" xmlns="http://www.w3.org/2000/svg">
  <title>К-9 — колонна вторичной перегонки бензина, АВТ-4</title>
  <rect x="0" y="0" width="760" height="960" fill="#CCCCCC" stroke="none"/>

  <!-- ==================== ШТУЦЕРА (до корпуса: стенка перекрывает корни) ==================== -->
  <g id="nozzles">

    <!-- ВЫХОД. Верхнее днище: пары фр. НК-62 °С -->
    <path class="k9__riser"  d="M 308.88 159.14 V 76.14" fill="none" stroke="#000000" stroke-width="5.108"/>
    <path class="k9__vapour" d="M 308.54 77.38 H 536.44" fill="none" stroke="#000000" stroke-width="2.389"/>

    <!-- ВХОД. Острое орошение от Н-54 (Н-54А), 60 тар. -->
    <path class="k9__nozzle" d="M 368 262 L 470 262" fill="none" stroke="#000000" stroke-width="4"/>

    <!-- ВХОД. 1 поток бензина из Т-16 (Н-57, Н-57А), 25 тар. -->
    <path class="k9__nozzle" d="M 252 392 L 150 392" fill="none" stroke="#000000" stroke-width="4"/>

    <!-- ВХОД. 2 поток бензина из Т-15/2 (низ К-4), 11 тар. -->
    <path class="k9__nozzle" d="M 252 642 L 150 642" fill="none" stroke="#000000" stroke-width="4"/>

    <!-- ВХОД. Возврат горячей струи из П-4 -->
    <path class="k9__nozzle" d="M 252 772 L 150 772" fill="none" stroke="#000000" stroke-width="4"/>

    <!-- ВЫХОД. Нижнее днище, левый: переток в К-10 -->
    <path class="k9__stub" d="M 287.89 838.84 V 872.33" fill="none" stroke="#000000" stroke-width="2.988"/>

    <!-- ВЫХОД. Нижнее днище, правый: на приём Н-76 (Н-79) → печь П-4 -->
    <path class="k9__stub" d="M 328.51 839.58 V 873.07" fill="none" stroke="#000000" stroke-width="2.988"/>

  </g>

  <!-- ==================== СТРЕЛКИ НАПРАВЛЕНИЯ ПОТОКА ==================== -->
  <g id="flow-arrows">
    <!-- выход паров: наружу, вправо -->
    <path class="k9__arrow" d="M 494 77.4 L 480 70.4 L 480 84.4 Z" fill="#000000"/>
    <!-- орошение: внутрь, влево -->
    <path class="k9__arrow" d="M 392 262 L 406 255 L 406 269 Z" fill="#000000"/>
    <!-- 1 поток: внутрь, вправо -->
    <path class="k9__arrow" d="M 228 392 L 214 385 L 214 399 Z" fill="#000000"/>
    <!-- 2 поток: внутрь, вправо -->
    <path class="k9__arrow" d="M 228 642 L 214 635 L 214 649 Z" fill="#000000"/>
    <!-- горячая струя: внутрь, вправо -->
    <path class="k9__arrow" d="M 228 772 L 214 765 L 214 779 Z" fill="#000000"/>
    <!-- низ левый: наружу, вниз -->
    <path class="k9__arrow" d="M 287.89 878 L 280.9 864 L 294.9 864 Z" fill="#000000"/>
    <!-- низ правый: наружу, вниз -->
    <path class="k9__arrow" d="M 328.51 878.7 L 321.5 864.7 L 335.5 864.7 Z" fill="#000000"/>
  </g>

  <!-- ==================== КОРПУС ==================== -->
  <path class="k9__shell" id="k9-shell"
        d="M 275 160 L 345 160 L 370 200 L 370 800 L 345 840 L 275 840 L 250 800 L 250 200 Z"
        fill="#D7D7D7" stroke="#000000" stroke-width="3" stroke-linejoin="miter"/>

  <!-- ==================== УРОВЕНЬ В КУБЕ (LRCA 632) ==================== -->
  <rect class="k9__level" id="k9-level" x="252" y="620" width="116" height="180" fill="#000000" stroke="none"/>

  <!-- ==================== ТАРЕЛКИ ==================== -->
  <g id="trays">
    <line class="k9__tray" x1="250" y1="270" x2="370" y2="270" stroke="#000000" stroke-width="1.4"/>
    <text class="k9__tr" x="256" y="265" fill="#000000" font-size="16">60 тар.</text>
    <line class="k9__tray" x1="250" y1="400" x2="370" y2="400" stroke="#000000" stroke-width="1.4"/>
    <text class="k9__tr" x="256" y="395" fill="#000000" font-size="16">25 тар.</text>
    <line class="k9__tray" x1="250" y1="650" x2="370" y2="650" stroke="#000000" stroke-width="1.4"/>
    <text class="k9__tr" x="256" y="645" fill="#000000" font-size="16">11 тар.</text>
    <line class="k9__tray" x1="250" y1="715" x2="370" y2="715" stroke="#000000" stroke-width="1.4"/>
    <text class="k9__tr" x="256" y="710" fill="#000000" font-size="16">8 тар.</text>
  </g>

  <!-- ==================== ПОЗИЦИЯ ==================== -->
  <text class="k9__tag" x="310" y="530" fill="#000000" font-size="42" letter-spacing="2" text-anchor="middle">К-9</text>

  <!-- ==================== СППК правый (с гусаком) ==================== -->
  <g id="sppk-right" transform="matrix(0.39641331,0,0,0.38988496,305.90037,77.475187)">
    <path class="pk__pipe"   d="M 78,211 V 160" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__pipe"   d="M 148,128 V 46 a 22,22 0 0 0 -44,0 v 36" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__pipe"   d="m 124,128 h 24" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__body"   d="M 78,128 58,162 H 98 Z" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__body"   d="m 78,128 46,-22 v 44 z" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__spring" d="M 78,128 60,118 72,112 58,104" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- ==================== СППК левый (зеркальный) ==================== -->
  <g id="sppk-left" transform="matrix(-0.39641331,0,0,0.38988496,312.52679,77.763809)">
    <path class="pk__pipe"   d="M 78,211 V 160" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__pipe"   d="m 124,128 h 24" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__body"   d="M 78,128 58,162 H 98 Z" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__body"   d="m 78,128 46,-22 v 44 z" fill="#D7D7D7" stroke="#000000" stroke-width="2.5"/>
    <path class="pk__spring" d="M 78,128 60,118 72,112 58,104" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- ==================== ПОДПИСИ ШТУЦЕРОВ ==================== -->
  <g id="labels">

    <!-- ВЫХОД 1 -->
    <text class="k9__io"   x="562" y="63"  fill="#000000" font-size="12" font-weight="bold">ВЫХОД</text>
    <text class="k9__lbl"  x="562" y="81"  fill="#000000" font-size="13">Пары фр. НК-62 °С</text>
    <text class="k9__lbl"  x="562" y="97"  fill="#000000" font-size="13">в Х-20, Х-21/1, АВЗ-1,2, Е-18</text>
    <text class="k9__lbli" x="562" y="113" fill="#000000" font-size="12" font-style="italic">PRCA 318</text>

    <!-- ВХОД 1 -->
    <text class="k9__io"   x="474" y="234" fill="#000000" font-size="12" font-weight="bold">ВХОД · 60 тар.</text>
    <text class="k9__lbl"  x="474" y="252" fill="#000000" font-size="13">Острое орошение фр. НК-62 °С</text>
    <text class="k9__lbl"  x="474" y="268" fill="#000000" font-size="13">от Н-54 (Н-54А)</text>
    <text class="k9__lbli" x="474" y="284" fill="#000000" font-size="12" font-style="italic">FRC 457 / TRC 17-57 / TR 201-32</text>

    <!-- ВХОД 2 -->
    <text class="k9__io"   x="146" y="350" fill="#000000" font-size="12" font-weight="bold" text-anchor="end">ВХОД · 25 тар.</text>
    <text class="k9__lbl"  x="146" y="368" fill="#000000" font-size="13" text-anchor="end">1 поток бензина из Т-16</text>
    <text class="k9__lbl"  x="146" y="384" fill="#000000" font-size="13" text-anchor="end">от Н-57 (Н-57А)</text>
    <text class="k9__lbli" x="146" y="400" fill="#000000" font-size="12" font-style="italic" text-anchor="end">FQRC 816 / TR 202-34</text>

    <!-- ВХОД 3 -->
    <text class="k9__io"   x="146" y="600" fill="#000000" font-size="12" font-weight="bold" text-anchor="end">ВХОД · 11 тар.</text>
    <text class="k9__lbl"  x="146" y="618" fill="#000000" font-size="13" text-anchor="end">2 поток бензина из Т-15/2</text>
    <text class="k9__lbl"  x="146" y="634" fill="#000000" font-size="13" text-anchor="end">(низ К-4)</text>
    <text class="k9__lbli" x="146" y="650" fill="#000000" font-size="12" font-style="italic" text-anchor="end">FQRC 442 / TR 17-40</text>

    <!-- ВХОД 4 -->
    <text class="k9__io"   x="146" y="750" fill="#000000" font-size="12" font-weight="bold" text-anchor="end">ВХОД · низ</text>
    <text class="k9__lbl"  x="146" y="768" fill="#000000" font-size="13" text-anchor="end">Горячая струя из П-4</text>
    <text class="k9__lbli" x="146" y="784" fill="#000000" font-size="12" font-style="italic" text-anchor="end">TRC 28 / TRC 30 / FRCA 448</text>

    <!-- ВЫХОД 2 (нижнее днище, левый штуцер) -->
    <text class="k9__io"   x="262" y="898" fill="#000000" font-size="12" font-weight="bold" text-anchor="end">ВЫХОД</text>
    <text class="k9__lbl"  x="262" y="916" fill="#000000" font-size="13" text-anchor="end">Фр. 62-180 °С, переток в К-10</text>
    <text class="k9__lbl"  x="262" y="932" fill="#000000" font-size="13" text-anchor="end">(17, 25, 31, 37 тар.)</text>
    <text class="k9__lbli" x="262" y="948" fill="#000000" font-size="12" font-style="italic" text-anchor="end">FRC 453 ← LRCA 632</text>

    <!-- ВЫХОД 3 (нижнее днище, правый штуцер) -->
    <text class="k9__io"   x="354" y="898" fill="#000000" font-size="12" font-weight="bold">ВЫХОД</text>
    <text class="k9__lbl"  x="354" y="916" fill="#000000" font-size="13">На приём Н-76 (Н-79)</text>
    <text class="k9__lbl"  x="354" y="932" fill="#000000" font-size="13">→ печь П-4 (горячая струя)</text>
    <text class="k9__lbli" x="354" y="948" fill="#000000" font-size="12" font-style="italic">FRCA 448 / TRC 28 / PR 284</text>

  </g>
</svg>
</div>

</body>
</html>
