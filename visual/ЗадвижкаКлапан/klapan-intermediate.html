<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клапан РСУ — состояние «Промежуточное»</title>
<style>
    /* --- УГО: Клапан РСУ: геометрия и части ---
       Корпус красится через currentColor (может мигать),
       индикатор положения — через переменную --ind (своя логика). */
    .zra{ display:inline-block; width:120px; line-height:0; --ind:currentColor; }
    .zra__svg{ display:block; width:100%; height:auto; }
    .zra__body{ fill:currentColor; stroke:#8c8c8c; stroke-width:2; stroke-linejoin:round; }
    .zra__ind { fill:var(--ind);   stroke:#8c8c8c; stroke-width:2; }
    .zra__stem{ fill:#a6a6a6; stroke:#8c8c8c; stroke-width:1.5; }
    .zra__hub { fill:#a6a6a6; stroke:#8c8c8c; stroke-width:1.5; }
    /* --- «Промежуточное»: всё ровным жёлтым --- */
    .zra.is-mid{ color:#ffff00; --ind:#ffff00; }

    /* --- оформление демо-страницы (в проект не переносится) --- */
    body{ margin:0; padding:32px; background:#cccccc;
          font:14px/1.5 "Segoe UI", Tahoma, sans-serif; color:#1c2126; }
    h1{ font-size:16px; margin:0 0 4px; }
    p{ margin:0 0 20px; max-width:440px; color:#39424b; }
    code{ background:#e2e6ea; padding:1px 5px; font:12.5px Consolas,monospace; }
</style>
</head>
<body>
  <h1>Клапан РСУ — состояние «Промежуточное»</h1>
  <p>Оба концевика не активны, положение между 0 и 100 %, команда не выполняется. Индикатор и корпус ровные жёлтые.<br>Класс состояния: <code>is-mid</code></p>
  <div class="zra is-mid">
      <svg class="zra__svg" viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg">
        <rect class="zra__stem" x="57.5" y="68" width="5" height="18"/>
        <polygon class="zra__body" points="34,64 34,104 60,84"/>
        <polygon class="zra__body" points="86,64 86,104 60,84"/>
        <circle class="zra__hub" cx="60" cy="84" r="6"/>
        <circle class="zra__ind" cx="60" cy="54.5" r="16"/>
      </svg>
  </div>
</body>
</html>
