<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>УГО С-1К</title>
<style>
  :root{
    /* Палитра по Приказу № 251-П, Приложение №1 */
    --bg:      #CCCCCC;   /* фон мнемосхемы             */
    --norm:    #D7D7D7;   /* нормальное/статичное обор.  */
    --line:    #000000;   /* контур, нефтепродукт        */
    --mesh-bg: #FFFFFF;   /* подложка каплеотбойника     */
  }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    font-family:Arial, Helvetica, sans-serif;
  }

  .mnemo{ display:inline-block; padding:24px; }

  /* ---- УГО сепаратора С-1К ---- */
  .sep-s1k{ display:block; }

  .sep-s1k .sep__nozzle{
    fill:none;
    stroke:var(--line);
    stroke-width:2.4;
    stroke-linecap:butt;
  }

  .sep-s1k .sep__body{
    fill:var(--norm);
    stroke:var(--line);
    stroke-width:2.4;
    stroke-linejoin:round;
  }

  .sep-s1k .sep__mesh-bg{ fill:var(--mesh-bg); }
  .sep-s1k .sep__mesh{    fill:url(#s1k-mesh); }

  .sep-s1k .sep__mesh-edge{
    stroke:var(--line);
    stroke-width:2;
  }

  .sep-s1k .sep__internal{
    stroke:var(--line);
    stroke-width:2.4;
  }
  .sep-s1k .sep__internal--thin{ stroke-width:1.6; }

  .sep-s1k .sep__tag{
    fill:var(--line);
    font-family:Arial, Helvetica, sans-serif;
    font-size:22px;
    text-anchor:middle;
    dominant-baseline:middle;
  }
</style>
</head>
<body>

<div class="mnemo">

  <!-- =========== УГО сепаратора С-1К =========== -->
  <svg class="sep-s1k" xmlns="http://www.w3.org/2000/svg"
       width="200" height="420" viewBox="0 0 200 420">
    <title>Сепаратор С-1К</title>

    <defs>
      <!-- Струйный каплеотбойник: перекрёстная штриховка -->
      <pattern id="s1k-mesh" width="9" height="9"
               patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#000000" stroke-width="1.3"/>
        <line x1="0" y1="0" x2="9" y2="0" stroke="#000000" stroke-width="1.3"/>
      </pattern>
    </defs>

    <!-- ---- ШТУЦЕРА (до корпуса, стенка перекрывает корни) ---- -->
    <g class="sep__nozzle" fill="none" stroke="#000000" stroke-width="2.4">
      <!-- Ш1 — выход ВСГ и лёгких углеводородов (верх) -->
      <line x1="136" y1="8"   x2="136" y2="62"/>
      <!-- Ш2 — сброс на ППК / факел (верх) -->
      <line x1="81"  y1="18"  x2="81"  y2="62"/>
      <!-- Ш3 — вход газопродуктовой смеси с Х-19 (левый) -->
      <line x1="8"   y1="178" x2="52"  y2="178"/>
      <!-- Ш4 — вход (правый) -->
      <line x1="192" y1="305" x2="148" y2="305"/>
      <!-- Ш5 — откачка жидкой фазы (низ) -->
      <line x1="100" y1="368" x2="100" y2="412"/>
      <!-- Ш6 — вывод/дренаж с нижнего конического днища (левый) -->
      <line x1="62"  y1="362" x2="40"  y2="404"/>
    </g>

    <!-- ---- КОРПУС АППАРАТА ---- -->
    <path class="sep__body"
          d="M 40,80 L 65,50 L 135,50 L 160,80 L 160,350 L 135,380 L 65,380 L 40,350 Z"
          fill="#D7D7D7" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- ---- СТРУЙНЫЙ КАПЛЕОТБОЙНИК ---- -->
    <rect class="sep__mesh-bg" x="41.2" y="130" width="117.6" height="20" fill="#FFFFFF"/>
    <rect class="sep__mesh"    x="41.2" y="130" width="117.6" height="20" fill="url(#s1k-mesh)"/>
    <line class="sep__mesh-edge" x1="41.2" y1="130" x2="158.8" y2="130"
          stroke="#000000" stroke-width="2"/>
    <line class="sep__mesh-edge" x1="41.2" y1="150" x2="158.8" y2="150"
          stroke="#000000" stroke-width="2"/>

    <!-- ---- ВНУТРЕННИЕ УСТРОЙСТВА ---- -->
    <line class="sep__internal" x1="73" y1="174" x2="73" y2="319"
          stroke="#000000" stroke-width="2.4"/>
    <line class="sep__internal sep__internal--thin" x1="112" y1="280" x2="112" y2="319"
          stroke="#000000" stroke-width="1.6"/>

    <!-- ---- ПОЗИЦИОННОЕ ОБОЗНАЧЕНИЕ ---- -->
    <text class="sep__tag" x="100" y="103"
          fill="#000000" font-family="Arial, Helvetica, sans-serif"
          font-size="22" text-anchor="middle" dominant-baseline="middle">С-1К</text>
  </svg>

</div>

</body>
</html>
